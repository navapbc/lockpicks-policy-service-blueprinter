<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Policy Service Blueprint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     USWDS v3.13 tokens (subset) inlined so this file stays a single
     portable HTML with no build step. Only the tokens used here are
     included. Swap the #data JSON to retarget this engine to any policy.
     ============================================================ */
  :root{
    --usa-blue-5:#eff6fb; --usa-blue-10:#d9e8f6; --usa-blue-20:#aacdec;
    --usa-blue-60v:#005ea2; --usa-blue-70v:#1a4480;
    --usa-blue-warm-70v:#1a4480; --usa-blue-warm-80v:#162e51; --usa-blue-cool-60v:#07648d;
    --usa-violet-70v:#54278f; --usa-green-cool-60v:#216e1f;
    --usa-orange-5:#f6efe9; --usa-orange-10:#f2e4d4; --usa-orange-50v:#c05600; --usa-orange-60:#775540;
    --usa-gold-20v:#ffbe2e; --usa-gold-50v:#936f38; --usa-red-60v:#b50909;
    --gray-cool-1:#fbfcfd; --gray-cool-2:#f7f9fa; --gray-cool-3:#f5f6f7; --gray-cool-5:#edeff0;
    --gray-cool-10:#dfe1e2; --gray-cool-20:#c6cace; --gray-cool-30:#a9aeb1;
    --gray-cool-50:#71767a; --gray-cool-60:#565c65; --gray-cool-70:#3d4551; --gray-cool-80:#2d2e2f;
    --gray-5:#f0f0f0; --gray-90:#1b1b1b;
    --bg:#ffffff; --panel:#ffffff; --ink:var(--gray-90);
    --muted:var(--gray-cool-60); --subtle:var(--gray-cool-50);
    --line:var(--gray-cool-10); --line-strong:var(--gray-cool-20);
    --primary:var(--usa-blue-60v); --primary-dark:var(--usa-blue-warm-70v); --primary-darker:var(--usa-blue-warm-80v);
    --link:var(--usa-blue-60v); --link-hover:var(--usa-blue-warm-70v);
    --focus:var(--usa-gold-20v);
    --flag-op:var(--usa-orange-50v); --flag-warn:var(--usa-gold-50v); --flag-auth:var(--usa-blue-60v);
    --font-serif:"Source Serif 4","Source Serif Pro",Georgia,Cambria,"Times New Roman",serif;
    --font-sans:"Inter","Public Sans",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --radius-sm:2px; --radius-md:.25rem; --radius-lg:.5rem; --radius-pill:99rem;
    --shadow-1:0 1px 4px 0 rgba(0,0,0,.08); --shadow-2:0 4px 8px 0 rgba(0,0,0,.1); --shadow-4:0 12px 24px 0 rgba(0,0,0,.14);
    --ease:.15s ease-in-out;
  }
  *{box-sizing:border-box}
  html{font-size:100%}
  body{margin:0;font-family:var(--font-sans);background:var(--bg);color:var(--ink);
    font-size:.9375rem;line-height:1.5;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
  a{color:var(--link);text-decoration:underline;text-underline-offset:.15em}
  a:hover{color:var(--link-hover)}
  a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,.chip:focus-visible,tr:focus-visible,th:focus-visible{
    outline:.25rem solid var(--focus);outline-offset:2px}
  .ic{width:1em;height:1em;fill:var(--ink);flex:none;vertical-align:-.14em}
  .ic path{fill:var(--ink)}
  .chip .chip-mk .ic,.chip .chip-mk .ic path{fill:#fff}
  /* header */
  header{background:var(--panel);border-top:4px solid var(--primary);border-bottom:1px solid var(--line);
    padding:.85rem 1.5rem;position:sticky;top:0;z-index:30}
  .htop{display:flex;align-items:center;gap:1rem 1.25rem;flex-wrap:wrap}
  h1{font-family:var(--font-serif);font-size:1.125rem;line-height:1.25;margin:0;font-weight:700;letter-spacing:-.005em;color:var(--ink)}
  .sub{color:var(--muted);font-size:.8125rem;margin-top:.25rem;line-height:1.45}
  .spacer{flex:1}
  select,button,input[type=text]{font:inherit;font-size:.875rem;border:1px solid var(--line-strong);border-radius:var(--radius-md);
    padding:.4rem .7rem;background:#fff;color:var(--ink)}
  button{cursor:pointer;font-weight:600}
  button:hover{border-color:var(--muted)}
  #sourcesBtn{display:inline-flex;align-items:center;gap:.4rem;white-space:nowrap;color:var(--primary);border:1px solid var(--primary);background:#fff}
  #sourcesBtn:hover{background:var(--usa-blue-5);border-color:var(--primary-dark);color:var(--primary-dark)}
  #sourcesBtn .ic{font-size:1rem}
  /* tabs */
  .tabs{display:flex;gap:.25rem;margin-left:auto;align-self:stretch;align-items:flex-end;margin-bottom:-.85rem}
  .tab{padding:.35rem .8rem 1.05rem;border:none;border-bottom:3px solid transparent;background:transparent;white-space:nowrap;
    color:var(--muted);font-weight:600;font-size:.9375rem;cursor:pointer;border-radius:var(--radius-sm) var(--radius-sm) 0 0}
  .tab:hover{color:var(--ink);border-bottom-color:var(--line-strong)}
  .tab.active{color:var(--primary-dark);border-bottom-color:var(--primary)}
  main{padding:1.5rem;max-width:1600px;margin:0 auto}
  #bpIntro{max-width:70ch;font-size:.9375rem;color:var(--muted);line-height:1.55;margin:0 0 .25rem}
  /* filters */
  .tfilters{display:flex;gap:1.25rem;flex-wrap:wrap;align-items:center;margin-bottom:1rem;font-size:.875rem}
  .tfilters .tflabel{font-weight:700;color:var(--muted);text-transform:uppercase;font-size:.75rem;letter-spacing:.05em}
  .tfilters label{display:flex;align-items:center;gap:.4rem;cursor:pointer}
  .tfilters label .ic{font-size:1.05rem}
  .tfilters input[type=checkbox]{width:1rem;height:1rem;accent-color:var(--primary);margin:0}
  /* requirements table */
  .rtwrap{background:transparent;overflow-x:auto}
  .rtable{width:100%;border-collapse:collapse;font-size:.875rem}
  .rtable th{text-align:left;font-size:.875rem;font-weight:700;color:var(--ink);background:transparent;
    border-bottom:2px solid var(--ink);padding:.7rem .9rem;white-space:nowrap}
  .rtable th.sortable{cursor:pointer;user-select:none}
  .rtable th.sortable:hover{background:var(--gray-cool-3)}
  .rtable .sortind{display:inline-flex;vertical-align:middle;margin-left:.15rem;opacity:.9}
  .rtable .sortind .ic{font-size:1rem}
  .rtable td{padding:.7rem .9rem;border-top:1px solid var(--line);vertical-align:top}
  .rtable tbody tr{cursor:pointer}
  .rtable tbody tr:hover{background:var(--usa-blue-5)}
  .rtable .tname{font-weight:600;max-width:380px;color:var(--ink)}
  .rtable .tflags{white-space:nowrap}
  .rtable .tflags .flag{display:inline-flex;font-size:1.05rem;margin-right:.35rem}
  .rtable td.empty{text-align:center;color:var(--muted);padding:2rem;cursor:default}
  .authlink{color:var(--link);font-weight:600;text-decoration:underline;text-underline-offset:.15em;cursor:pointer}
  .authlink:hover{color:var(--link-hover)}
  .authlink .ext{font-size:.9em;margin-left:.1rem;text-decoration:none;vertical-align:-.1em}
  /* legend */
  .legend{display:flex;gap:.75rem 1.25rem;flex-wrap:wrap;background:var(--gray-cool-3);border:1px solid var(--line);
    border-radius:var(--radius-lg);padding:.7rem 1rem;margin-bottom:2rem;font-size:.8125rem;align-items:center;color:var(--muted)}
  .legend .lg{display:flex;align-items:center;gap:.35rem}
  .legend .lg .flag{display:inline-flex;font-size:1.05rem}
  .typepill{display:inline-block;font-size:.6875rem;font-weight:700;padding:.15rem .5rem;border-radius:var(--radius-sm);
    color:#fff;white-space:nowrap;text-transform:uppercase;letter-spacing:.03em;line-height:1.3}
  /* drawer detail */
  .rdetail{display:flex;flex-direction:column;gap:.65rem}
  .badges{display:flex;gap:.4rem;flex-wrap:wrap}
  .badge{display:inline-flex;align-items:center;gap:.3rem;font-size:.6875rem;font-weight:700;padding:.15rem .5rem;
    border-radius:var(--radius-sm);text-transform:uppercase;letter-spacing:.03em;white-space:nowrap}
  .badge .ic{font-size:.95rem}
  .b-op{background:var(--usa-orange-50v);color:#fff;border:none}
  .b-op .ic,.b-op .ic path{fill:#fff}
  .stmt{margin:0;font-size:1rem;line-height:1.55;color:var(--ink)}
  .rdsub{display:flex;align-items:center;gap:.4rem;font-family:var(--font-serif);font-size:1rem;font-weight:700;color:var(--ink);
    border-top:1px solid var(--line);padding-top:.65rem;margin-top:.15rem}
  .rdsub .rdi{font-size:1.05rem;color:var(--primary)}
  .rdmeta{display:flex;align-items:center;gap:.35rem;font-size:.8125rem;color:var(--usa-blue-cool-60v);font-weight:600;margin-top:-.2rem}
  .rdmeta .rdi{font-size:1rem}
  .rdline{font-size:.8125rem;color:var(--ink);line-height:1.5}
  .rdnote{font-size:.8125rem;color:var(--muted);line-height:1.55}
  blockquote{margin:0;padding:.6rem .85rem;background:var(--gray-cool-2);border-left:4px solid var(--line-strong);
    font-size:.8125rem;color:var(--gray-cool-70);font-style:italic;line-height:1.55;border-radius:0 var(--radius-sm) var(--radius-sm) 0}
  /* blueprint */
  .bpwrap{overflow-x:auto}
  #bp{display:flex;flex-direction:column;gap:0;margin-bottom:3rem}
  .bptable{padding:0;background:transparent;border:none;box-shadow:none}
  .bptable + .bptable{margin-top:3.5rem;padding-top:3.5rem;border-top:1px solid var(--line)}
  .bptitle{display:flex;align-items:baseline;gap:.6rem;flex-wrap:wrap;font-family:var(--font-serif);font-size:1.5rem;font-weight:700;text-transform:capitalize;
    padding:0;margin:.1rem 0 1.1rem;line-height:1.2}
  .bptitle .altpath{font-family:var(--font-sans);font-size:.625rem;font-weight:600;color:var(--muted);text-transform:uppercase;white-space:nowrap;
    letter-spacing:.05em;background:transparent;border:1px solid var(--line-strong);border-radius:var(--radius-pill);padding:.1rem .5rem;align-self:center}
  .bpgrid{display:grid;gap:.5rem;align-items:stretch;width:100%}
  .colhead{padding:.5rem .1rem;border-radius:0;background:transparent;color:var(--ink);border-bottom:2px solid var(--ink);font-size:.875rem;font-weight:700;line-height:1.3}
  .colhead .step{font-size:.75rem;opacity:.85;letter-spacing:.05em;text-transform:uppercase;display:block;margin-bottom:.1rem;font-weight:400}
  .lanelbl{display:flex;flex-direction:column;justify-content:center;font-size:.75rem;font-weight:400;text-transform:uppercase;
    letter-spacing:.05em;color:var(--ink);background:transparent;border-radius:0;border-right:2px solid var(--ink);padding:.5rem .7rem .5rem .1rem;text-align:right;line-height:1.25}
  .lane-claim,.lane-input,.lane-actor,.lane-out{background:transparent}
  .cell{background:var(--gray-cool-2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:.55rem;font-size:.875rem;line-height:1.45}
  .cell.q{background:var(--gray-cool-2);border-color:var(--line);color:var(--ink)}
  .cell.inputs{background:var(--gray-cool-2);border-color:var(--line);display:flex;flex-wrap:wrap;gap:.3rem;align-items:flex-start}
  .cell.inputs.empty{background:transparent;border:1px dashed var(--line-strong)}
  .qi{background:#fff;border:1px solid var(--line-strong);color:var(--gray-cool-70);border-radius:var(--radius-pill);
    font-size:.8125rem;font-weight:600;padding:.15rem .5rem;height:fit-content}
  .cell.actor{display:flex;flex-direction:column;gap:.35rem;background:var(--gray-cool-2);border-color:var(--line);padding:.5rem}
  .cell.actor.empty{background:transparent;border:1px dashed var(--line)}
  .cell.out{display:flex;flex-direction:column;align-items:flex-start;gap:.35rem;background:var(--gray-cool-2);border-color:var(--line);padding:.5rem}
  .chip{display:inline-flex;align-items:center;gap:.4rem;border:none;border-radius:var(--radius-md);color:#fff;
    font-family:var(--font-sans);font-size:.875rem;font-weight:600;padding:.4rem .55rem;cursor:pointer;text-align:left;width:100%;line-height:1.3}
  .chip:hover{filter:brightness(1.08)}
  .chip .chip-t{flex:1}
  .chip .chip-mk{display:inline-flex;align-items:center;gap:.15rem;opacity:.9}
  .chip .chip-mk .ic{width:.9em;height:.9em}
  .opill{font-size:.8125rem;font-weight:700;border:1px solid transparent;border-radius:var(--radius-pill);padding:.4rem .75rem;display:inline-block;text-align:left;line-height:1.4}
  .crosscut{margin-top:1rem;background:#d9e8f6;color:var(--ink);border-radius:var(--radius-md);padding:.8rem 1rem;
    display:flex;gap:.6rem .7rem;flex-wrap:wrap;flex-direction:row;align-items:center}
  .crosscut b{display:flex;align-items:center;gap:.4rem;font-family:var(--font-serif);font-size:1.05rem;font-weight:700;text-transform:none;letter-spacing:0;color:var(--ink)}
  .crosscut b .cc{font-size:1.05rem}
  .crosscut .cc-chips{display:flex;gap:.4rem;flex-wrap:wrap}
  .crosscut .chip{width:auto}
  /* drawer shell */
  #scrim{position:fixed;inset:0;background:rgba(27,27,27,.35);opacity:0;pointer-events:none;transition:opacity var(--ease);z-index:40}
  #scrim.open{opacity:1;pointer-events:auto}
  #drawer{position:fixed;top:0;right:-560px;width:540px;max-width:92vw;height:100%;background:var(--bg);
    box-shadow:var(--shadow-4);transition:right .25s ease-in-out;z-index:50;display:flex;flex-direction:column}
  #drawer.open{right:0}
  .dhead{background:var(--panel);border-bottom:1px solid var(--line);padding:1rem 1.15rem;display:flex;align-items:flex-start;gap:.6rem}
  .dhead h2{font-family:var(--font-serif);margin:0;font-size:1.25rem;line-height:1.25;color:var(--ink)}
  #dType{margin-top:.5rem;display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
  .dbody{overflow:auto;padding:1rem 1.15rem;display:flex;flex-direction:column;gap:.9rem}
  .x{margin-left:auto;background:none;border:none;color:var(--muted);cursor:pointer;padding:.15rem;display:inline-flex;border-radius:var(--radius-sm)}
  .x .ic{font-size:1.4rem}
  .x:hover{color:var(--ink);background:var(--gray-cool-3)}
  .empty{color:var(--muted);text-align:center;padding:2.5rem}
</style>
</head>
<body>
<header>
  <div class="htop">
    <div>
      <h1 id="hTitle">Policy Service Blueprint</h1>
      <div class="sub" id="hSub"></div>
    </div>
    <div class="tabs">
      <button class="tab active" data-view="blueprint">Service blueprint</button>
      <button class="tab" data-view="table">All requirements</button>
    </div>
    <button id="sourcesBtn" title="Policy sources used to build this tool">View sources</button>
  </div>
</header>

<main>
  <section id="view-blueprint">
    <p class="sub" id="bpIntro" style="max-width:940px;font-size:13px;margin-top:0"></p>
    <div class="legend" id="legend"></div>
    <div class="bpwrap">
      <div id="bp"></div>
      <div class="crosscut" id="crosscut" style="display:none"></div>
    </div>
  </section>

  <section id="view-table" style="display:none">
    <div class="tfilters">
      <span class="tflabel">Filter:</span>
      <label><input type="checkbox" id="fOp"> <svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="color:var(--flag-op)"><path d="M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6 6 9 1.6 4.7C.4 7.1.9 10.1 2.9 12.1c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.5-.4.5-1.1.1-1.4z"></path></svg> Operational (agency practice, not strict policy)</label>
      <label><input type="checkbox" id="fGap"> <svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="color:var(--flag-warn)"><path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"></path></svg> Potential issue (AI-suggested)</label>
      <label><input type="checkbox" id="fAuth"> <svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="color:var(--flag-auth)"><path d="M4 10v7h3v-7H4zm6 0v7h3v-7h-3zM2 22h19v-3H2v3zm14-12v7h3v-7h-3zm-4.5-9L2 6v2h19V6l-9.5-5z"></path></svg> Multiple policies</label>
    </div>
    <div class="rtwrap">
      <table class="rtable">
        <thead><tr><th>Name</th><th>Citation</th><th class="sortable" id="thType" title="Sort by type">Type <span class="sortind" id="typeSortInd"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8l-6 6 1.41 1.41L12 10.83l4.59 4.58L18 14z"></path></svg></span></th><th>Flags</th></tr></thead>
        <tbody id="rtbody"></tbody>
      </table>
    </div>
  </section>
</main>

<div id="scrim"></div>
<div id="drawer">
  <div class="dhead">
    <div><h2 id="dTitle">Requirement</h2><div id="dType"></div></div>
    <button class="x" id="dClose" title="Close" aria-label="Close"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"></path></svg></button>
  </div>
  <div class="dbody" id="dBody"></div>
</div>

Review decisions", "url": null, "note": "Internal Drive extract · all 7 cases construe separation-side issues (43:21-5(a)/(b)), none weekly certification · Board of Review decisions have no stable public link (Appeal Research Tool is interactive-only)"}]}, "tiers": [{"key": "federal_reg", "label": "Federal regulation (20 CFR)", "rank": 1, "color": "#1a4480"}, {"key": "state_statute", "label": "State statute (N.J.S.A. 43:21)", "rank": 2, "color": "#54278f"}, {"key": "state_reg", "label": "State regulation (N.J.A.C. 12:17)", "rank": 3, "color": "#0c4e29"}], "requirements": [{"id": "CERT-01", "topic": "Certification filing — Continue reporting as directed", "tier": "state_statute", "actor": "claimant", "nature": "policy", "citation": "N.J.S.A. 43:21-4(a)", "citationUrl": "https://codes.findlaw.com/nj/title-43-pensions-and-retirement-and-unemployment-compensation/nj-st-sect-43-21-4/", "statement": "A claimant is eligible for a week only if they filed a claim and continue to report as directed by the Division; the Division may waive or alter reporting by regulation (e.g., for job-attached claimants).", "quote": "The individual has filed a claim at an unemployment insurance claims office and thereafter continues to report at an employment service office or unemployment insurance claims office, as directed by the division in accordance with such regulations as the division may prescribe, except that the division may, by regulation, waive or alter either or both of the requirements of this subsection as to individuals attached to regular jobs...", "authority": null, "forms": null, "gap": "The statute delegates the entire cadence and format of certification to Division regulation; \"attached to regular jobs\" (the waiver group) is undefined."}, {"id": "CERT-02", "topic": "Certification filing — 24/7 online certification, 7 PM cutoff", "tier": "state_statute", "actor": "system", "nature": "policy", "citation": "N.J.S.A. 43:21-6(a)(2)", "citationUrl": "https://www.nj.gov/labor/myunemployment/assets/pdfs/UI_statute.pdf", "statement": "The system must let a claimant certify, cancel, or close a claim online at any time, 24/7; certifications after 7:00 P.M. are processed on the next scheduled posting date.", "quote": "Any claimant may choose to certify, cancel or close his claim for unemployment insurance benefits at any time, 24 hours a day and seven days a week, via the Internet on a website developed by the division; however, any claim that is certified, cancelled or closed after 7:00 PM will not be processed by the division until the next scheduled posting date.", "authority": null, "forms": null, "gap": "\"Next scheduled posting date\" is not defined in statute — the posting calendar is agency practice."}, {"id": "CERT-03", "topic": "Certification filing — Biweekly period & 21-day window", "tier": "state_reg", "actor": "claimant", "nature": "policy", "citation": "N.J.A.C. 12:17-4.3(c)", "citationUrl": "https://www.law.cornell.edu/regulations/new-jersey/N-J-A-C-12-17-4-3", "statement": "The claimant must complete the certification (phone or Internet) during the assigned week, or within 21 calendar days after the designated benefit period ends. A designated benefit period is two consecutive calendar weeks ending on the Saturday of the second week.", "quote": "An individual shall be ineligible for benefits unless the claimant completes a certification telephone call or an Internet application during the assigned week as directed by the Division, or within 21 calendar days of the last day of the designated benefit period. For the purposes of this section, a \"designated benefit period\" is the two consecutive calendar weeks that can be claimed for payment and which ends on the Saturday of the second week.", "authority": {"higher": "N.J.S.A. 43:21-4(a)", "higherUrl": "https://codes.findlaw.com/nj/title-43-pensions-and-retirement-and-unemployment-compensation/nj-st-sect-43-21-4/", "lower": "N.J.A.C. 12:17-4.3(c)", "lowerUrl": "https://www.law.cornell.edu/regulations/new-jersey/N-J-A-C-12-17-4-3", "higherRef": null, "lowerRef": null, "controls": "state statute", "note": "Statute requires continued reporting \"as directed\"; the regulation supplies the biweekly cadence and the 21-day late window."}, "forms": null, "gap": null}, {"id": "CERT-04", "topic": "Certification filing — Assigned method & written instructions", "tier": "state_reg", "actor": "system", "nature": "policy", "citation": "N.J.A.C. 12:17-4.3(a)–(b)", "citationUrl": "https://www.law.cornell.edu/regulations/new-jersey/N-J-A-C-12-17-4-3", "statement": "The Division must assign each claimant a reporting method and issue written instructions stating when and how to claim continued benefits.", "quote": "A claimant shall be assigned a reporting method, in person, by mail, telephone, via an Internet application or as the Division may otherwise prescribe, and shall be required to report as directed to claim completed weeks of unemployment benefits. ... A claimant shall be issued written instructions, which shall indicate when and how the individual is to claim benefits, including when and how the individual is to claim continued benefits.", "authority": null, "forms": ["Written reporting instructions"], "gap": null}, {"id": "CERT-05", "topic": "Certification filing — Continuous reporting & 14-day reassertion", "tier": "state_reg", "actor": "claimant", "nature": "policy", "citation": "N.J.A.C. 12:17-4.3(e)", "citationUrl": "https://www.law.cornell.edu/regulations/new-jersey/N-J-A-C-12-17-4-3", "statement": "A claimant must stay in continuous reporting status. After missing a designated benefit period, they can reassert the claim for later weeks only by contacting the Division within 14 days of the next two-week period; after that, ineligibility continues until the week they contact the Division.", "quote": "An individual must be in continuous reporting status to be eligible for unemployment benefits. Once an individual is ineligible for benefits because of his or her failure to comply with reporting requirements for a designated benefit period, he or she may reassert his or her claim for later weeks of unemployment only if the individual contacts the Division within 14 days of the subsequent two-week designated benefit period.", "authority": null, "forms": null, "gap": "How the 21-day late window in (c) and the 14-day reassertion window in (e) interact is not spelled out — certification logic must reconcile the two clocks."}, {"id": "CERT-06", "topic": "Certification filing — Good cause for failure to report", "tier": "state_reg", "actor": "caseworker", "nature": "policy", "citation": "N.J.A.C. 12:17-4.1(b)", "citationUrl": "https://www.law.cornell.edu/regulations/new-jersey/N-J-A-C-12-17-4-1", "statement": "Failure to report as directed makes the week ineligible unless a fact-finding hearing finds good cause — any substantial situation that prevented the claimant from reporting.", "quote": "An individual who fails to report as directed will be ineligible for benefits unless, pursuant to a fact-finding hearing, it is determined that there is \"good cause\" for failing to comply. For the purposes of this subchapter, \"good cause\" means any situation which was substantial and prevented the claimant from reporting as required by the Division.", "authority": null, "forms": null, "gap": "\"Substantial\" is undefined — good-cause calls are case-by-case caseworker judgment."}, {"id": "CERT-07", "topic": "Certification filing — Week begins only after claim filed", "tier": "state_statute", "actor": "system", "nature": "policy", "citation": "N.J.S.A. 43:21-19(m)(3)", "citationUrl": "https://codes.findlaw.com/nj/title-43-pensions-and-retirement-and-unemployment-compensation/nj-st-sect-43-21-19/", "statement": "A week of unemployment cannot begin before the claim is filed — the statutory hook for timeliness and any backdating rules the Division adopts.", "quote": "An individual's week of unemployment shall be deemed to commence only after the individual has filed a claim at an unemployment insurance claims office, except as the division may by regulation otherwise prescribe.", "authority": null, "forms": null, "gap": "Backdating standards live entirely in regulation (\"except as the division may by regulation otherwise prescribe\")."}, {"id": "AA-01", "topic": "Able & available — Required for each week paid", "tier": "federal_reg", "actor": "system", "nature": "policy", "citation": "20 CFR 604.3(a)", "citationUrl": "https://www.ecfr.gov/current/title-20/chapter-V/part-604/section-604.3", "statement": "The system may pay a week of UC only to a claimant who was able to work and available for work for that week — the federal floor behind the weekly able-and-available questions.", "quote": "A State may pay UC only to an individual who is able to work and available for work for the week for which UC is claimed.", "authority": null, "forms": null, "gap": null}, {"id": "AA-02", "topic": "Able & available — Labor-market test & geographic scope", "tier": "federal_reg", "actor": "caseworker", "nature": "policy", "citation": "20 CFR 604.3(b)", "citationUrl": "https://www.ecfr.gov/current/title-20/chapter-V/part-604/section-604.3", "statement": "Able-and-available is tested by whether the claimant is offering services for which a labor market exists (job vacancies not required); the state defines the geographic labor market.", "quote": "Whether an individual is able to work and available for work under paragraph (a) of this section must be tested by determining whether the individual is offering services for which a labor market exists... The State must determine the geographical scope of the labor market for an individual under its UC law.", "authority": null, "forms": null, "gap": "New Jersey has not defined the geographic labor market by rule in N.J.A.C. 12:17 — left to adjudication practice."}, {"id": "AA-03", "topic": "Able & available — Weekly able, available & seeking attestation", "tier": "state_statute", "actor": "claimant", "nature": "policy", "citation": "N.J.S.A. 43:21-4(c)(1)", "citationUrl": "https://codes.findlaw.com/nj/title-43-pensions-and-retirement-and-unemployment-compensation/nj-st-sect-43-21-4/", "statement": "For each week claimed, the claimant must be able to work, available for work, and demonstrate active work search, subject to statutory exceptions (e.g., approved training).", "quote": "The individual is able to work, and is available for work, and has demonstrated to be actively seeking work, except as hereinafter provided in this subsection or in subsection (f) of this section.", "authority": {"higher": "20 CFR 604.3(a)", "higherUrl": "https://www.ecfr.gov/current/title-20/chapter-V/part-604/section-604.3", "lower": "N.J.S.A. 43:21-4(c)(1)", "lowerUrl": "https://codes.findlaw.com/nj/title-43-pensions-and-retirement-and-unemployment-compensation/nj-st-sect-43-21-4/", "higherRef": null, "lowerRef": null, "controls": "federal", "note": "The federal rule sets the able-and-available floor and expressly allows additional state requirements (20 CFR 604.3(c)); New Jersey adds the actively-seeking-work test."}, "forms": null, "gap": "\"Able,\" \"available,\" and \"actively seeking\" are undefined in statute, and N.J.A.C. 12:17 supplies no general definitions either."}, {"id": "AA-04", "topic": "Able & available — Partial-week ability to work", "tier": "federal_reg", "actor": "caseworker", "nature": "policy", "citation": "20 CFR 604.4(a)", "citationUrl": "https://www.ecfr.gov/current/title-20/chapter-V/part-604/section-604.4", "statement": "A claimant able to work for only part of the week may still be treated as able to work, unless the limitation amounts to a withdrawal from the labor market.", "quote": "A State may consider an individual to be able to work during the week of unemployment claimed if the individual is able to work for all or a portion of the week claimed, provided any limitation on his or her ability to work does not constitute a withdrawal from the labor market.", "authority": null, "forms": null, "gap": "Permissive federal flexibility (\"may\") — New Jersey has not codified how partial-week ability is handled."}, {"id": "AA-05", "topic": "Able & available — Illness or injury after demonstrated A&A", "tier": "federal_reg", "actor": "caseworker", "nature": "policy", "citation": "20 CFR 604.4(b)", "citationUrl": "https://www.ecfr.gov/current/title-20/chapter-V/part-604/section-604.4", "statement": "Illness or injury during a claimed week need not defeat \"able to work\" if the claimant demonstrated ability and availability after the most recent separation and refused no suitable work because of the illness; availability may follow under 604.5(g).", "quote": "If an individual has previously demonstrated his or her ability to work and availability for work following the most recent separation from employment, the State may consider the individual able to work during the week of unemployment claimed despite the individual's illness or injury, unless the individual has refused an offer of suitable work due to such illness or injury.", "authority": null, "forms": null, "gap": "Permissive federal flexibility; New Jersey's operative illness pathway is the Disability During Unemployment program (N.J.A.C. 12:17-17)."}, {"id": "AA-06", "topic": "Able & available — Jury duty counts toward availability", "tier": "federal_reg", "actor": "caseworker", "nature": "policy", "citation": "20 CFR 604.5(b)", "citationUrl": "https://www.ecfr.gov/current/title-20/chapter-V/part-604/section-604.5", "statement": "Jury duty during a claimed week may count as continued availability if the claimant demonstrated availability after the most recent separation.", "quote": "If an individual has previously demonstrated his or her availability for work following the most recent separation from employment and is appearing for duty before any court under a lawfully issued summons during the week of unemployment claimed, a State may consider the individual to be available for work.", "authority": null, "forms": null, "gap": "Permissive; no New Jersey rule in 43:21 or 12:17 addresses jury duty at certification."}, {"id": "WS-01", "topic": "Actively seeking work — Work search is a state option", "tier": "federal_reg", "actor": "system", "nature": "policy", "citation": "20 CFR 604.5(h)", "citationUrl": "https://www.ecfr.gov/current/title-20/chapter-V/part-604/section-604.5", "statement": "Federal law does not itself require an active work search; states may add one — New Jersey's actively-seeking test is a state policy choice layered on the federal floor.", "quote": "The requirement that an individual be available for work does not require an active work search on the part of the individual. States may, however, require an individual to be actively seeking work to be considered available for work, or States may impose a separate requirement that the individual must actively seek work.", "authority": null, "forms": null, "gap": null}, {"id": "WS-02", "topic": "Actively seeking work — Must demonstrate active work search", "tier": "state_statute", "actor": "claimant", "nature": "policy", "citation": "N.J.S.A. 43:21-4(c)(1)", "citationUrl": "https://codes.findlaw.com/nj/title-43-pensions-and-retirement-and-unemployment-compensation/nj-st-sect-43-21-4/", "statement": "The claimant must have \"demonstrated\" active work search for the week — an evidentiary showing whose form (number of contacts, documentation) is set nowhere in statute or N.J.A.C. 12:17.", "quote": "...and has demonstrated to be actively seeking work, except as hereinafter provided in this subsection or in subsection (f) of this section.", "authority": {"higher": "20 CFR 604.5(h)", "higherUrl": "https://www.ecfr.gov/current/title-20/chapter-V/part-604/section-604.5", "lower": "N.J.S.A. 43:21-4(c)(1)", "lowerUrl": "https://codes.findlaw.com/nj/title-43-pensions-and-retirement-and-unemployment-compensation/nj-st-sect-43-21-4/", "higherRef": null, "lowerRef": null, "controls": "federal", "note": "Federal regulation permits states to impose a work-search requirement; New Jersey exercises the option in statute."}, "forms": null, "gap": "MAJOR GAP: no rule in N.J.A.C. 12:17 quantifies work-search contacts or documentation. The operative standard appears only in agency practice (certification questions and legacy exemption codes) — confirm the current standard with a policy SME."}, {"id": "WS-03", "topic": "Actively seeking work — One-Stop registration & appointments", "tier": "state_reg", "actor": "claimant", "nature": "policy", "citation": "N.J.A.C. 12:17-4.3(f)", "citationUrl": "https://www.law.cornell.edu/regulations/new-jersey/N-J-A-C-12-17-4-3", "statement": "The claimant may be required to report in person to a One-Stop Career Center for work registration and work-search activities; missing the appointment without good cause makes that week ineligible.", "quote": "...an individual may be required to report in person to the One-Stop Career Center to register for work and for other work search related activities. A claimant who fails to report to an in-person appointment at a One-Stop Career Center shall be ineligible for the week in which he or she failed to report, unless good cause is shown.", "authority": null, "forms": null, "gap": null}, {"id": "WS-04", "topic": "Actively seeking work — Refusal to participate at One-Stop", "tier": "state_reg", "actor": "caseworker", "nature": "policy", "citation": "N.J.A.C. 12:17-4.3(f)1", "citationUrl": "https://www.law.cornell.edu/regulations/new-jersey/N-J-A-C-12-17-4-3", "statement": "Refusing to participate in or complete a scheduled One-Stop activity without good cause makes the claimant unavailable and ineligible for that week, continuing indefinitely until they agree to be rescheduled.", "quote": "A claimant who, without \"good cause,\" as defined in N.J.A.C. 12:17-4.1, refuses to report for the purpose of participating in, or to complete a scheduled activity (for example, claims interview, work search activity, etc.) at the One-Stop Career Center shall be held unavailable for work and ineligible for benefits for the week in which the refusal occurred. Additionally, he or she will continue to be ineligible indefinitely until the week he or she contacts the Division and agrees to be rescheduled to participate.", "authority": null, "forms": null, "gap": null}, {"id": "WS-05", "topic": "Actively seeking work — No denial while in approved training", "tier": "federal_reg", "actor": "system", "nature": "policy", "citation": "20 CFR 604.5(c)", "citationUrl": "https://www.ecfr.gov/current/title-20/chapter-V/part-604/section-604.5", "statement": "The system must not deny a week for unavailability while the claimant is in state-approved training — a mandatory federal floor.", "quote": "A State must not deny UC to an individual for failure to be available for work during a week if, during such week, the individual is in training with the approval of the State agency.", "authority": null, "forms": null, "gap": null}, {"id": "WS-06", "topic": "Actively seeking work — Approved training exception (state)", "tier": "state_statute", "actor": "caseworker", "nature": "policy", "citation": "N.J.S.A. 43:21-4(c)(4)(A)", "citationUrl": "https://codes.findlaw.com/nj/title-43-pensions-and-retirement-and-unemployment-compensation/nj-st-sect-43-21-4/", "statement": "A claimant in Division-approved training cannot be held unavailable or ineligible — including for refusing work while in the program.", "quote": "Subject to such limitations and conditions as the division may prescribe, an individual, who is otherwise eligible, shall not be deemed unavailable for work or ineligible because the individual is attending a training program approved for the individual by the division to enhance the individual's employment opportunities or because the individual failed or refused to accept work while attending such program.", "authority": {"higher": "20 CFR 604.5(c)", "higherUrl": "https://www.ecfr.gov/current/title-20/chapter-V/part-604/section-604.5", "lower": "N.J.S.A. 43:21-4(c)(4)(A)", "lowerUrl": "https://codes.findlaw.com/nj/title-43-pensions-and-retirement-and-unemployment-compensation/nj-st-sect-43-21-4/", "higherRef": null, "lowerRef": null, "controls": "federal", "note": "The federal rule mandates the approved-training protection; the state statute implements it and adds approval conditions."}, "forms": null, "gap": "Training-approval criteria are Division discretion."}, {"id": "RSW-01", "topic": "Refusal of suitable work — Disqualification: week + 3 weeks", "tier": "state_statute", "actor": "caseworker", "nature": "policy", "citation": "N.J.S.A. 43:21-5(c)", "citationUrl": "https://codes.findlaw.com/nj/title-43-pensions-and-retirement-and-unemployment-compensation/nj-st-sect-43-21-5/", "statement": "Failing without good cause to apply for or accept suitable work (or to return to customary self-employment when directed) disqualifies the claimant for that week plus the three following weeks.", "quote": "If it is found that the individual has failed, without good cause, either to apply for available, suitable work when so directed by the employment office or the director or to accept suitable work when it is offered, or to return to the individual's customary self-employment (if any) when so directed by the director. The disqualification shall continue for the week in which the failure occurred and for the three weeks which immediately follow that week...", "authority": null, "forms": null, "gap": "\"Good cause\" for refusal is not defined in statute; N.J.A.C. 12:17-11.4 (Good cause for refusal of suitable work) exists but was not in the source extract — pull and verify with an SME."}, {"id": "RSW-02", "topic": "Refusal of suitable work — Disqualification timing & start date", "tier": "state_reg", "actor": "caseworker", "nature": "policy", "citation": "N.J.A.C. 12:17-11.1", "citationUrl": "https://www.law.cornell.edu/regulations/new-jersey/N-J-A-C-12-17-11-1", "statement": "The regulation restates the week-plus-three disqualification and adds timing: for a refused offer with a definite start date, the disqualification is imposed in the week the work was to begin.", "quote": "The disqualification shall continue for the week in which the failure to apply occurred and for the three weeks which immediately follow that week. This disqualification for failure to accept suitable work shall be imposed during the week in which the individual refused the work or, if there is a definite starting date, the week in which the work is to begin.", "authority": {"higher": "N.J.S.A. 43:21-5(c)", "higherUrl": "https://codes.findlaw.com/nj/title-43-pensions-and-retirement-and-unemployment-compensation/nj-st-sect-43-21-5/", "lower": "N.J.A.C. 12:17-11.1", "lowerUrl": "https://www.law.cornell.edu/regulations/new-jersey/N-J-A-C-12-17-11-1", "higherRef": null, "lowerRef": null, "controls": "state statute", "note": "Regulation implements the statutory disqualification and supplies the start-date timing rule."}, "forms": null, "gap": null}, {"id": "RSW-06", "topic": "Refusal of suitable work — Bona fide offer required", "tier": "state_reg", "actor": "caseworker", "nature": "policy", "citation": "N.J.A.C. 12:17-11.3(a)–(b)", "citationUrl": "https://www.law.cornell.edu/regulations/new-jersey/N-J-A-C-12-17-11-3", "statement": "No disqualification without a bona fide offer: a specific job with details (duties, pay, hours) actually conveyed to the claimant; cutting off the conversation does not defeat the offer.", "quote": "An individual shall not be disqualified for benefits pursuant to this subchapter unless it has been established that there was a bona fide offer of work or referral to work which he or she refused. ... If an individual prevents the details of the job from being relayed by refusing the job or the referral at the beginning of the interview, the offer is still considered bona fide.", "authority": null, "forms": null, "gap": "Employer documentation duties are hortatory (\"should document\") — evidentiary weight unresolved."}, {"id": "RSW-07", "topic": "Refusal of suitable work — What counts as new work", "tier": "state_reg", "actor": "caseworker", "nature": "policy", "citation": "N.J.A.C. 12:17-11.5(a)", "citationUrl": "https://www.law.cornell.edu/regulations/new-jersey/N-J-A-C-12-17-11-5", "statement": "Refusal review covers \"new work\": offers from a never-before employer, recall offers after an indefinite layoff, or an offer of substantially different duties or terms from the present employer.", "quote": "An individual shall be subject to disqualification for benefits if he or she fails to accept or apply for suitable new work. For purposes of this subchapter, \"new work\" means: 1. An offer of work made to an unemployed individual by an employer with whom he or she has never worked; 2. An offer of reemployment ... by any former employer, following an indefinite layoff with no recall date; or 3. An offer of work made by an individual's present employer of substantially different duties, terms or conditions of employment...", "authority": null, "forms": null, "gap": "\"Substantially different duties, terms or conditions\" — the factor list is expressly non-exhaustive."}, {"id": "RSW-03", "topic": "Refusal of suitable work — Statutory suitability factors", "tier": "state_statute", "actor": "caseworker", "nature": "policy", "citation": "N.J.S.A. 43:21-5(c)(1)", "citationUrl": "https://codes.findlaw.com/nj/title-43-pensions-and-retirement-and-unemployment-compensation/nj-st-sect-43-21-5/", "statement": "Suitability weighs health/safety/morals risk, physical fitness, prior training/experience/earnings, length of unemployment, local prospects in the customary occupation, and distance from residence.", "quote": "In determining whether or not any work is suitable for an individual, consideration shall be given to the degree of risk involved to health, safety, and morals, the individual's physical fitness and prior training, experience and prior earnings, the individual's length of unemployment and prospects for securing local work in the individual's customary occupation, and the distance of the available work from the individual's residence.", "authority": null, "forms": null, "gap": "No weighting among factors; suitability tightens with length of unemployment only implicitly."}, {"id": "RSW-08", "topic": "Refusal of suitable work — Regulatory suitability factors", "tier": "state_reg", "actor": "caseworker", "nature": "policy", "citation": "N.J.A.C. 12:17-11.2(a)", "citationUrl": "https://www.law.cornell.edu/regulations/new-jersey/N-J-A-C-12-17-11-2", "statement": "The regulation mirrors the statutory suitability factors, adding \"employee benefits\" to prior earnings and framing the distance test as commuting distance.", "quote": "In determining whether or not the work is suitable, consideration shall be given to the degree of risk involved to health, safety and morals, the individual's physical fitness and prior training, experience and prior earnings and employee benefits, the individual's length of unemployment, prospects for securing work in the individual's customary occupation and commuting distance.", "authority": {"higher": "N.J.S.A. 43:21-5(c)(1)", "higherUrl": "https://codes.findlaw.com/nj/title-43-pensions-and-retirement-and-unemployment-compensation/nj-st-sect-43-21-5/", "lower": "N.J.A.C. 12:17-11.2(a)", "lowerUrl": "https://www.law.cornell.edu/regulations/new-jersey/N-J-A-C-12-17-11-2", "higherRef": null, "lowerRef": null, "controls": "state statute", "note": "Regulation implements the statutory suitability factors with added detail."}, "forms": null, "gap": null}, {"id": "RSW-04", "topic": "Refusal of suitable work — 80% wage floor", "tier": "state_reg", "actor": "caseworker", "nature": "policy", "citation": "N.J.A.C. 12:17-11.2(a)2", "citationUrl": "https://www.law.cornell.edu/regulations/new-jersey/N-J-A-C-12-17-11-2", "statement": "Wage suitability floor: within the benefit year, work is suitable in wage terms only at 80% or more of the claimant's base-year average weekly wage (including the value of employee benefits); sub-minimum-wage offers are never suitable.", "quote": "For purposes of this subchapter, and restricted to those offers of work made during an individual's benefit year, suitability in terms of wages means eighty percent of the claimant's average weekly wage (including the value of employee benefits) during the base year.", "authority": null, "forms": null, "gap": "Valuation method for employee benefits unspecified."}, {"id": "RSW-05", "topic": "Refusal of suitable work — Work never deemed suitable", "tier": "state_statute", "actor": "caseworker", "nature": "policy", "citation": "N.J.S.A. 43:21-5(c)(2)", "citationUrl": "https://codes.findlaw.com/nj/title-43-pensions-and-retirement-and-unemployment-compensation/nj-st-sect-43-21-5/", "statement": "Never suitable: positions vacant due to a strike/lockout, work with substantially substandard pay/hours/conditions for the locality, or jobs conditioned on joining a company union or leaving a bona fide union.", "quote": "Notwithstanding any other provisions of this chapter, no work shall be deemed suitable and benefits shall not be denied under this chapter to any otherwise eligible individual for refusing to accept new work under any of the following conditions: the position offered is vacant due directly to a strike, lockout, or other labor dispute; the remuneration, hours, or other conditions of the work offered are substantially less favorable to the individual than those prevailing for similar work in the locality; or, the individual, as a condition of being employed, would be required to join a company union or to resign from or refrain from joining any bona fide labor organization.", "authority": null, "forms": null, "gap": "\"Substantially less favorable\" and \"prevailing\" comparisons require labor-market data; the method is undefined. (This mirrors the FUTA §3304(a)(5) federal labor-standards floor.)"}, {"id": "EARN-01", "topic": "Earnings & partial unemployment — Definition of unemployed", "tier": "state_statute", "actor": "claimant", "nature": "policy", "citation": "N.J.S.A. 43:21-19(m)(1)", "citationUrl": "https://codes.findlaw.com/nj/title-43-pensions-and-retirement-and-unemployment-compensation/nj-st-sect-43-21-19/", "statement": "A claimant is \"unemployed\" for a week only if not in full-time work and earning less than the weekly benefit rate; involuntary unpaid vacation counts; corporate officers and >5% owners of the employing corporation are excluded.", "quote": "An individual shall be deemed \"unemployed\" for any week during which: (A) The individual is not engaged in full-time work and with respect to which his remuneration is less than his weekly benefit rate, including any week during which he is on vacation without pay; provided such vacation is not the result of the individual's voluntary action...", "authority": null, "forms": null, "gap": "MAJOR GAP: \"full-time work\" is undefined in statute and in N.J.A.C. 12:17. The legacy system's 32-hour test is an operational proxy, not policy — do not import it as a requirement without SME confirmation of its source."}, {"id": "EARN-02", "topic": "Earnings & partial unemployment — Week of partial unemployment", "tier": "state_reg", "actor": "system", "nature": "policy", "citation": "N.J.A.C. 12:17-2.1 (\"Week of partial unemployment\")", "citationUrl": "https://www.law.cornell.edu/regulations/new-jersey/N-J-A-C-12-17-2-1", "statement": "A partial-unemployment week requires no more than 80% of the hours normally worked in the occupation, due to lack of work, with earnings not exceeding the weekly benefit rate plus 20%.", "quote": "\"Week of partial unemployment\" means a calendar week ending at midnight Saturday in which an individual is employed not more than 80 percent of the hours normally worked in that individual's occupation, profession, trade, or industry; due to lack of work; and earns remuneration which does not exceed the weekly benefit rate plus 20 percent of such rate.", "authority": null, "forms": null, "gap": "Baseline for \"hours normally worked\" (the claimant's own schedule vs. an industry norm) is undefined; note the tension with 43:21-19(m)(1)'s below-WBR ceiling."}, {"id": "EARN-03", "topic": "Earnings & partial unemployment — Week of total unemployment", "tier": "state_reg", "actor": "system", "nature": "policy", "citation": "N.J.A.C. 12:17-2.1 (\"Week of total unemployment\")", "citationUrl": "https://www.law.cornell.edu/regulations/new-jersey/N-J-A-C-12-17-2-1", "statement": "A total-unemployment week means no services performed and no remuneration received; the certification week runs Sunday through Saturday midnight.", "quote": "\"Week of total unemployment\" means a calendar week ending at midnight Saturday in which an individual performs no services and with respect to which the individual receives no remuneration.", "authority": null, "forms": null, "gap": "\"Performs no services\" has no de minimis threshold."}, {"id": "EARN-04", "topic": "Earnings & partial unemployment — Remuneration defined", "tier": "state_statute", "actor": "claimant", "nature": "policy", "citation": "N.J.S.A. 43:21-19(p)", "citationUrl": "https://codes.findlaw.com/nj/title-43-pensions-and-retirement-and-unemployment-compensation/nj-st-sect-43-21-19/", "statement": "Reportable remuneration is all compensation for personal services — commissions, bonuses, and the cash value of in-kind compensation.", "quote": "\"Remuneration\" means all compensation for personal services, including commission and bonuses and the cash value of all compensation in any medium other than cash.", "authority": null, "forms": null, "gap": null}, {"id": "EARN-05", "topic": "Earnings & partial unemployment — Partial benefit formula", "tier": "state_statute", "actor": "system", "nature": "policy", "citation": "N.J.S.A. 43:21-3(b)", "citationUrl": "https://codes.findlaw.com/nj/title-43-pensions-and-retirement-and-unemployment-compensation/nj-st-sect-43-21-3/", "statement": "Partial benefit = weekly benefit rate minus remuneration above the disregard (the greater of 20% of the weekly benefit rate or $5), computed down to the next lower whole dollar.", "quote": "...shall be paid an amount (except as to final payment) equal to his weekly benefit rate less any remuneration... paid or payable to him for such week in excess of 20% of his weekly benefit rate (fractional part of a dollar omitted) or $5.00, whichever is the greater; provided that such amount shall be computed to the next lower multiple of $1.00 if not already a multiple thereof.", "authority": null, "forms": null, "gap": "\"Paid or payable for such week\" — allocation of earnings to the week earned vs. the week paid is not specified."}, {"id": "EARN-06", "topic": "Earnings & partial unemployment — 20% earnings disregard rule", "tier": "state_reg", "actor": "system", "nature": "policy", "citation": "N.J.A.C. 12:17-8.5(a)", "citationUrl": "https://www.law.cornell.edu/regulations/new-jersey/N-J-A-C-12-17-8-5", "statement": "Weekly benefits are reduced by wages (including casual work) received above 20% of the weekly benefit rate.", "quote": "An individual's eligibility for weekly benefits shall be reduced by an amount equal to any wages or remuneration, including remuneration from casual work, received in excess of 20 percent of the individual's weekly benefit rate.", "authority": {"higher": "N.J.S.A. 43:21-3(b)", "higherUrl": "https://codes.findlaw.com/nj/title-43-pensions-and-retirement-and-unemployment-compensation/nj-st-sect-43-21-3/", "lower": "N.J.A.C. 12:17-8.5(a)", "lowerUrl": "https://www.law.cornell.edu/regulations/new-jersey/N-J-A-C-12-17-8-5", "higherRef": null, "lowerRef": null, "controls": "state statute", "note": "The statute's disregard is the greater of 20% of the weekly benefit rate or $5.00; the regulation states only the 20% term — the statute controls."}, "forms": null, "gap": "Regulation omits the statutory $5 alternative floor and says \"received\" where the statute says \"paid or payable.\""}, {"id": "EARN-07", "topic": "Earnings & partial unemployment — Tips & imputed wages", "tier": "state_reg", "actor": "caseworker", "nature": "policy", "citation": "N.J.A.C. 12:17-8.5(b)", "citationUrl": "https://www.law.cornell.edu/regulations/new-jersey/N-J-A-C-12-17-8-5", "statement": "Tips are reportable wages; if gratuities go unreported, wages are imputed at the applicable minimum wage or actual remuneration, whichever is higher.", "quote": "If gratuities are not reported, the individual's \"wages\" shall be determined in accordance with the minimum wage rates prescribed under any labor law or regulation of this State or of the United States, or the amount of remuneration actually received by the employee from the employer, whichever is higher.", "authority": null, "forms": null, "gap": null}, {"id": "EARN-08", "topic": "Earnings & partial unemployment — Election-day work carve-out", "tier": "state_reg", "actor": "system", "nature": "policy", "citation": "N.J.A.C. 12:17-8.12", "citationUrl": "https://www.law.cornell.edu/regulations/new-jersey/N-J-A-C-12-17-8-12", "statement": "Election-day board work does not make a claimant unavailable and must not reduce the weekly benefit — a special case the earnings logic must carve out (the statute likewise excludes this pay from remuneration, 43:21-19(m)(2)).", "quote": "...an unemployed individual, who is otherwise eligible for benefits, shall not be deemed unavailable for work or ineligible solely by reason of the individual's work as a board worker for a county board of election on an election day.", "authority": null, "forms": null, "gap": null}, {"id": "PAY-01", "topic": "Deductible payments — Pay in lieu of notice", "tier": "state_reg", "actor": "caseworker", "nature": "policy", "citation": "N.J.A.C. 12:17-8.6(a)–(b)", "citationUrl": "https://www.law.cornell.edu/regulations/new-jersey/N-J-A-C-12-17-8-6", "statement": "Weeks covered by remuneration in lieu of notice are not compensable (the claimant is not unemployed); coverage for less than a full week may allow partial benefits.", "quote": "An individual receiving remuneration in lieu of notice is disqualified for benefits and the claim for benefits is invalid because the claimant is considered not unemployed. Notwithstanding any provision of this subsection, an individual who receives remuneration in lieu of notice for a period less than a calendar week may be eligible for partial benefits for such week.", "authority": null, "forms": null, "gap": null}, {"id": "PAY-02", "topic": "Deductible payments — Severance is not a bar", "tier": "state_reg", "actor": "caseworker", "nature": "policy", "citation": "N.J.A.C. 12:17-8.7(b)", "citationUrl": "https://www.law.cornell.edu/regulations/new-jersey/N-J-A-C-12-17-8-7", "statement": "Severance or separation pay — periodic or lump sum — does not bar weekly benefits.", "quote": "The receipt of severance or separation pay in periodic payments or in a lump sum shall not be a bar to eligibility for unemployment benefits.", "authority": null, "forms": null, "gap": "Distinguishing severance (no bar) from salary continuation (a bar, 12:17-8.8) is a fact call on the underlying agreement."}, {"id": "PAY-03", "topic": "Deductible payments — Salary continuation", "tier": "state_reg", "actor": "caseworker", "nature": "policy", "citation": "N.J.A.C. 12:17-8.8(a)", "citationUrl": "https://www.law.cornell.edu/regulations/new-jersey/N-J-A-C-12-17-8-8", "statement": "Weeks in which an employer continues wages or salary without requiring services (salary continuation) are ineligible through the contract's termination date.", "quote": "An employer may elect to continue wage or salary payments and forego the services normally performed by the employee through the date of termination provided for by contract or other agreement. A claim filed by an individual receiving such payments shall be invalid and he or she shall be ineligible for benefits through the date of termination of contract or other agreement.", "authority": null, "forms": null, "gap": null}, {"id": "PAY-04", "topic": "Deductible payments — Vacation & holiday pay", "tier": "state_reg", "actor": "caseworker", "nature": "policy", "citation": "N.J.A.C. 12:17-8.10(a)–(c)", "citationUrl": "https://www.law.cornell.edu/regulations/new-jersey/N-J-A-C-12-17-8-10", "statement": "Voluntary vacation weeks are ineligible (claimant unavailable); paid contractual shutdown weeks are ineligible, but unpaid ones may qualify; a terminal lump-sum payout of unused vacation is not a bar.", "quote": "An individual who voluntarily takes a vacation is ineligible for benefits as the individual is unavailable for work. ... Where a union or employment contract calls for a vacation or holiday period with pay and permits the employer to close its operations for a specified period, the employees shall be ineligible for benefits. However, any employee who does not receive pay for the contractual vacation period or any part thereof may receive unemployment benefits if otherwise eligible. ... The receipt of a lump sum payment at termination representing unused accrued vacation leave is not a bar to the receipt of unemployment benefits.", "authority": null, "forms": null, "gap": "How \"voluntarily takes a vacation\" is established from certification answers is undefined."}, {"id": "PAY-05", "topic": "Deductible payments — Sick leave pay", "tier": "state_reg", "actor": "caseworker", "nature": "policy", "citation": "N.J.A.C. 12:17-8.11(a)–(b)", "citationUrl": "https://www.law.cornell.edu/regulations/new-jersey/N-J-A-C-12-17-8-11", "statement": "Weeks with periodic employer sick-leave payments are ineligible (the claimant is still employed); a terminal lump-sum payout of unused sick leave is not a bar.", "quote": "An individual who receives periodic sick leave payments from an employer is considered employed and is ineligible for unemployment benefits because the claim is invalid. ... When an individual's employment is terminated, any lump sum payment of unused accrued sick leave is not a bar to the receipt of unemployment benefits.", "authority": null, "forms": null, "gap": null}, {"id": "PEN-01", "topic": "Pension offset — Weekly reduction, not below zero", "tier": "state_statute", "actor": "system", "nature": "policy", "citation": "N.J.S.A. 43:21-5a", "citationUrl": "https://codes.findlaw.com/nj/title-43-pensions-and-retirement-and-unemployment-compensation/nj-st-sect-43-21-5a/", "statement": "Weekly benefits are reduced — not below zero — by pension, retirement, or annuity amounts based on previous work that are reasonably attributable to the week.", "quote": "The amount of benefits payable to an individual for any week which begins in a period with respect to which such individual is receiving a governmental or other pension, retirement or retired pay, annuity, or other similar periodic payment which is based on the previous work of such individual shall be reduced, but not below zero, by an amount equal to the amount of such pension... which is reasonably attributable to such week...", "authority": null, "forms": null, "gap": "\"Reasonably attributable to such week\" — the proration method is left to regulation."}, {"id": "PEN-02", "topic": "Pension offset — Base-period employer plans only", "tier": "state_reg", "actor": "system", "nature": "policy", "citation": "N.J.A.C. 12:17-8.1(a)–(b)", "citationUrl": "https://www.law.cornell.edu/regulations/new-jersey/N-J-A-C-12-17-8-1", "statement": "Only pensions under a plan maintained or contributed to by a base-period or chargeable employer trigger the offset; no reduction if base-year work did not affect pension eligibility or amount.", "quote": "When a pension is received from a base period or chargeable employer, benefits shall be reduced if the pension, retirement or retired pay, annuity, or other similar payment is under a plan maintained or contributed to by such employer. ... If the remuneration for services performed for the employer during the base year by the individual does not affect eligibility for, or increase the amount of, the pension ... then the individual's unemployment benefits shall not be reduced by the amount of the pension.", "authority": {"higher": "N.J.S.A. 43:21-5a", "higherUrl": "https://codes.findlaw.com/nj/title-43-pensions-and-retirement-and-unemployment-compensation/nj-st-sect-43-21-5a/", "lower": "N.J.A.C. 12:17-8.1", "lowerUrl": "https://www.law.cornell.edu/regulations/new-jersey/N-J-A-C-12-17-8-1", "higherRef": null, "lowerRef": null, "controls": "state statute", "note": "The statute permits the Division to limit the offset to base-period/chargeable-employer plans; the regulation exercises that permission."}, "forms": null, "gap": null}, {"id": "PEN-03", "topic": "Pension offset — Offset percent by plan contribution", "tier": "state_reg", "actor": "system", "nature": "policy", "citation": "N.J.A.C. 12:17-8.2(a)", "citationUrl": "https://www.law.cornell.edu/regulations/new-jersey/N-J-A-C-12-17-8-2", "statement": "Offset schedule by funding source: 100% reduction for employer-funded plans, 50% for jointly funded, none for fully claimant-funded plans, and none for Social Security where the claimant contributed.", "quote": "1. If such payment is made under a plan to which the individual did not contribute, the weekly and maximum amount of benefits payable ... shall be reduced by an amount equal to the amount of the pension ... reasonably attributable to such week ...; 2. If ... the employer and individual contributed, the amount of benefits payable ... will be reduced by an amount equal to 50 percent of the amount of the pension ... 3. If ... the individual contributed 100 percent, the amount of benefits payable ... shall not be reduced; 4. No reduction ... if the pension ... is from the Social Security pension to which the individual has made any contribution.", "authority": null, "forms": null, "gap": "\"Reasonably attributable to such week\" proration method not specified."}, {"id": "PEN-04", "topic": "Pension offset — Constructive receipt & retroactive awards", "tier": "state_reg", "actor": "system", "nature": "policy", "citation": "N.J.A.C. 12:17-8.4(a)–(b)", "citationUrl": "https://www.law.cornell.edu/regulations/new-jersey/N-J-A-C-12-17-8-4", "statement": "The offset starts the first calendar week after constructive receipt of the pension award; retroactive awards reduce already-paid weeks and create a refundable overpayment.", "quote": "A reduction in benefits shall be made as of the first calendar week commencing after the claimant is given constructive receipt of a retirement pension award. ... an individual who receives a retroactive pension payment shall be subject to benefit reduction as of the first calendar week commencing after the effective date of pension entitlement ... and shall be liable to refund any resulting overpayment of benefits.", "authority": null, "forms": null, "gap": "The claimant must report at certification a pension they may not yet be receiving in cash — constructive receipt is a notification test."}, {"id": "PEN-05", "topic": "Pension offset — 60-day rollover exemption", "tier": "state_reg", "actor": "caseworker", "nature": "policy", "citation": "N.J.A.C. 12:17-8.4(c)", "citationUrl": "https://www.law.cornell.edu/regulations/new-jersey/N-J-A-C-12-17-8-4", "statement": "Qualified rollovers completed within 60 days do not reduce benefits.", "quote": "There will be no reduction of benefits where there is a transfer of an eligible rollover distribution from a qualified trust to an eligible retirement plan ... if all the requirements of section 402 of the Internal Revenue Code are met within 60 days of receipt by the individual.", "authority": null, "forms": null, "gap": "The 60-day rollover window can post-date the certification, forcing provisional treatment of the week."}, {"id": "PEN-06", "topic": "Pension offset — Lump sums at involuntary separation", "tier": "state_statute", "actor": "caseworker", "nature": "policy", "citation": "N.J.S.A. 43:21-5a(2)", "citationUrl": "https://codes.findlaw.com/nj/title-43-pensions-and-retirement-and-unemployment-compensation/nj-st-sect-43-21-5a/", "statement": "For claimants involuntarily and permanently separated before full pension rights, a lump sum in lieu of periodic pension reduces benefits only in the week of receipt.", "quote": "The amount of benefits payable to an individual who is involuntarily and permanently separated from employment prior to the date at which the individual may retire with full pension rights shall not be reduced pursuant to this section because the individual receives a lump sum payment in lieu of periodic pension, retirement or annuity payments, except that the benefits payable to the individual may be reduced during the week in which the individual receives the lump sum payment.", "authority": null, "forms": null, "gap": null}, {"id": "CHG-01", "topic": "Status changes — Corporate officers & 5% owners", "tier": "state_reg", "actor": "caseworker", "nature": "policy", "citation": "N.J.A.C. 12:17-12.1(a)", "citationUrl": "https://www.law.cornell.edu/regulations/new-jersey/N-J-A-C-12-17-12-1", "statement": "Corporate officers and >5% owners claiming on the corporation's wages are not unemployed in any week during their term of office or ownership — the claim is invalid.", "quote": "An officer of a corporation and/or a person who has more than five percent equitable or debt interest in the corporation, whose claim for benefits is based on wages with that corporation, shall not be considered unemployed in any week during the individual's term of office or ownership in the corporation and the claim shall be determined invalid.", "authority": null, "forms": null, "gap": null}, {"id": "CHG-02", "topic": "Status changes — Leave of absence", "tier": "state_reg", "actor": "caseworker", "nature": "policy", "citation": "N.J.A.C. 12:17-12.3(a)", "citationUrl": "https://www.law.cornell.edu/regulations/new-jersey/N-J-A-C-12-17-12-3", "statement": "Weeks on a voluntary, mutually agreed leave of absence are not weeks of unemployment; claims filed during the leave are invalid.", "quote": "A voluntary and mutually agreed upon leave of absence between an employer and employee connotes a continuity of employment. An individual on an approved leave of absence is not considered unemployed under the Unemployment Compensation Law and any claim for benefits filed during this period shall be invalid...", "authority": null, "forms": null, "gap": null}, {"id": "CHG-03", "topic": "Status changes — Temporary side business", "tier": "state_reg", "actor": "caseworker", "nature": "policy", "citation": "N.J.A.C. 12:17-12.5(a)–(b)", "citationUrl": "https://www.law.cornell.edu/regulations/new-jersey/N-J-A-C-12-17-12-5", "statement": "A claimant running a temporary side business stays eligible only if still available and actively seeking work, weighed by four criteria: business income vs. prior/sought salary, hours in the business vs. work-search effort, breadth of continued availability, and indicia of a permanent business.", "quote": "A claimant who seeks to augment his or her income through a temporary business may be eligible to receive unemployment benefits only if he or she is available for work, actively seeking employment and otherwise meets the eligibility requirements...", "authority": null, "forms": null, "gap": "Four-factor balancing with no thresholds. Also note 12:17-12.5(d): unincorporated temporary-business income is not \"wages\" — so it may escape the 8.5(a) earnings reduction. Confirm treatment with an SME."}, {"id": "CHG-04", "topic": "Status changes — Part-time-only availability", "tier": "state_reg", "actor": "caseworker", "nature": "policy", "citation": "N.J.A.C. 12:17-12.7(b)", "citationUrl": "https://www.law.cornell.edu/regulations/new-jersey/N-J-A-C-12-17-12-7", "statement": "A claimant limiting availability to part-time work is ineligible unless they worked part-time in a substantial portion of the base year, sufficient part-time work exists in their labor market, and they are available for enough hours to earn at least the weekly benefit amount.", "quote": "An individual who limits his or her availability to parttime work shall be ineligible for benefits unless the following conditions are met: 1. The individual has worked in part-time work during a substantial portion of the individual's base year...; 2. There is sufficient part-time work in the claimant's general labor market...; and 3. The individual is available for enough weekly hours to be able to earn remuneration equal to at least the individual's weekly benefit amount.", "authority": null, "forms": null, "gap": "\"Substantial portion\" and \"sufficient part-time work\" undefined."}, {"id": "CHG-05", "topic": "Status changes — Full-time students", "tier": "state_reg", "actor": "caseworker", "nature": "policy", "citation": "N.J.A.C. 12:17-12.6(a)", "citationUrl": "https://www.law.cornell.edu/regulations/new-jersey/N-J-A-C-12-17-12-6", "statement": "Full-time students (20+ class hours/week non-higher-ed; 12+ credits undergraduate; 9+ credits post-graduate) are disqualified unless in Division-approved training or their base-year wages were earned while attending school outside customary vacation periods.", "quote": "An individual, who is a student in full-time attendance at, or on vacation from, an educational institution, is disqualified for benefits, unless: 1. The individual is attending a training program approved by the Division to enhance the individual's earning power and/or employability; or 2. During the claimant's base year, the individual, who during periods other than established and customary vacation periods or holiday recesses at the educational institution, has earned in employment sufficient wages while in full or part-time attendance at an educational institution to establish a claim for benefits.", "authority": null, "forms": null, "gap": null}, {"id": "CHG-06", "topic": "Status changes — Temp-firm contact (written agreement)", "tier": "state_reg", "actor": "claimant", "nature": "policy", "citation": "N.J.A.C. 12:17-15.2(b)", "citationUrl": "https://www.law.cornell.edu/regulations/new-jersey/N-J-A-C-12-17-15-2", "statement": "A temp-firm claimant with a written agreement must contact the firm for reassignment by the end of the next business day after an assignment ends (or the agreement's longer window), or the claim is reviewed as a voluntary quit.", "quote": "An individual's claim which is based on employment with a temporary help service firm shall be reviewed as a voluntary leaving of work issue if the individual fails to contact the temporary help service firm for reassignment by the end of the next business day after completion of the last assignment unless a greater time period is specified in the written agreement.", "authority": null, "forms": ["Temporary help service firm written agreement"], "gap": null}, {"id": "CHG-07", "topic": "Status changes — Temp-firm contact (no agreement)", "tier": "state_reg", "actor": "claimant", "nature": "policy", "citation": "N.J.A.C. 12:17-15.3(b)", "citationUrl": "https://www.law.cornell.edu/regulations/new-jersey/N-J-A-C-12-17-15-3", "statement": "Without a written agreement, the same missed reassignment contact is reviewed as an availability issue instead of a quit.", "quote": "An individual's claim which is based on employment with a temporary help service firm shall be reviewed as an available for work issue if the individual fails to contact the firm for reassignment by the end of the next business day after completion of the last assignment and there is no written agreement between the temporary help service firm and the individual.", "authority": null, "forms": null, "gap": "Identical conduct is a quit issue or an availability issue depending on paperwork — the system needs the agreement on file."}, {"id": "CHG-08", "topic": "Status changes — Disability claim suspends reporting", "tier": "state_reg", "actor": "system", "nature": "policy", "citation": "N.J.A.C. 12:17-17.3", "citationUrl": "https://www.law.cornell.edu/regulations/new-jersey/N-J-A-C-12-17-17-3", "statement": "Filing notice and proof of a Disability During Unemployment claim suspends the subchapter-4 work-registration and reporting (certification) requirements for the covered period.", "quote": "The giving of notice of disability and the filing of proof of a claim for disability benefits during unemployment shall dispense with the requirements of N.J.A.C. 12:17-4 concerning registering for work and reporting to the Division for the period covered by the claim.", "authority": null, "forms": ["Proof and Claim for Disability Benefits (with medical certification)"], "gap": null}, {"id": "CHG-09", "topic": "Status changes — Reasserting ability after recovery", "tier": "state_reg", "actor": "claimant", "nature": "policy", "citation": "N.J.A.C. 12:17-17.5(a)", "citationUrl": "https://www.law.cornell.edu/regulations/new-jersey/N-J-A-C-12-17-17-5", "statement": "Coming off a disability period, the claimant must reassert ability to work by reporting to the Division during the week of recovery or the week immediately following.", "quote": "If the simultaneous benefit period occurs at the end of the disability, the claimant must assert his or her ability to work by reporting to the Division during the calendar week of his or her recovery or in the calendar week immediately following...", "authority": null, "forms": null, "gap": null}, {"id": "INT-01", "topic": "Integrity — 25% fine for false statements", "tier": "state_statute", "actor": "claimant", "nature": "policy", "citation": "N.J.S.A. 43:21-16(a)(1)", "citationUrl": "https://codes.findlaw.com/nj/title-43-pensions-and-retirement-and-unemployment-compensation/nj-st-sect-43-21-16/", "statement": "A knowing false statement — or knowing failure to disclose a material fact — to obtain or increase benefits carries a fine of 25% of the amount fraudulently obtained; each false weekly certification is a separate offense.", "quote": "Whoever makes a false statement or representation, knowing it to be false, or knowingly fails to disclose a material fact, to obtain or increase or attempts to obtain or increase any benefit or other payment under this chapter..., either for himself or for any other person, shall be liable to a fine of 25% of the amount fraudulently obtained... and each such false statement or representation or failure to disclose a material fact shall constitute a separate offense.", "authority": null, "forms": null, "gap": "\"Material fact\" undefined."}, {"id": "INT-02", "topic": "Integrity — One-year fraud disqualification", "tier": "state_statute", "actor": "caseworker", "nature": "policy", "citation": "N.J.S.A. 43:21-5(g)(1)", "citationUrl": "https://codes.findlaw.com/nj/title-43-pensions-and-retirement-and-unemployment-compensation/nj-st-sect-43-21-5/", "statement": "Illegal receipt (or attempted receipt) of benefits via false or fraudulent representation disqualifies the claimant for one year from the Division's discovery; a court conviction is conclusive on the appeal bodies.", "quote": "For a period of one year from the date of the discovery by the division of the illegal receipt or attempted receipt of benefits contrary to the provisions of this chapter, as the result of any false or fraudulent representation...", "authority": null, "forms": null, "gap": "No express intent standard in this subsection (contrast 16(a)(1)'s \"knowing\") — whether negligent misstatements are swept in is unresolved; the discovery date is undefined."}, {"id": "INT-03", "topic": "Integrity — Full repayment of overpaid benefits", "tier": "state_statute", "actor": "system", "nature": "policy", "citation": "N.J.S.A. 43:21-16(d)(1)", "citationUrl": "https://codes.findlaw.com/nj/title-43-pensions-and-retirement-and-unemployment-compensation/nj-st-sect-43-21-16/", "statement": "Benefits received while any condition was unfulfilled or while disqualified must be repaid in full unless waived; absent fraud, recovery requires notice within four years of payment.", "quote": "When it is determined... that any person has received any sum as benefits under this chapter... while any conditions for the receipt of benefits imposed by this chapter... were not fulfilled in his case, or while he was disqualified from receiving benefits... such person... shall be liable to repay those benefits in full... except in the event of fraud, no person shall be liable for any such refunds or deductions against future benefits unless so notified before four years have elapsed from the time the benefits in question were paid.", "authority": null, "forms": null, "gap": null}, {"id": "INT-04", "topic": "Integrity — Demand for refund within 4 years", "tier": "state_reg", "actor": "system", "nature": "policy", "citation": "N.J.A.C. 12:17-14.1", "citationUrl": "https://www.law.cornell.edu/regulations/new-jersey/N-J-A-C-12-17-14-1", "statement": "Every overpayment determination triggers a mailed demand for refund (within four years except fraud); fraud cases may be referred to the Attorney General for prosecution.", "quote": "The Division shall issue a demand for refund of unemployment benefits in each case when a determination of overpayment is made. Except in the case of fraud, an individual shall be notified of the demand for refund within four years after benefits were received. ... In case of fraud, the matter may be forwarded to the Attorney General for investigation and criminal prosecution.", "authority": null, "forms": ["Demand for refund notice"], "gap": null}, {"id": "INT-05", "topic": "Integrity — Mandatory waiver circumsta
