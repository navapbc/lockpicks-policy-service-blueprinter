nces (statute)", "tier": "state_statute", "actor": "caseworker", "nature": "policy", "citation": "N.J.S.A. 43:21-16(d)(4)", "citationUrl": "https://codes.findlaw.com/nj/title-43-pensions-and-retirement-and-unemployment-compensation/nj-st-sect-43-21-16/", "statement": "On the claimant's request, the director must grant a full waiver of overpayment recovery — if the claimant made no misrepresentation — where the claimant is deceased, disabled and unable to work, the overpayment came from Division or employer error, or recovery would be contrary to equity and good conscience.", "quote": "...only under the following circumstances: (A) Where the claimant is deceased; (B) Where the claimant is disabled and no longer able to work; (C) Where the claimant received the overpayment of benefits due to an error by the division, or due to an error of the employer...; or (D) Where the director determines that recovery of the overpayment would be contrary to equity and good conscience.", "authority": null, "forms": null, "gap": "\"Equity and good conscience\" undefined — director discretion. Quote trimmed to the four circumstances; the source sheet's text of the lead-in clause contained transcription errors — verify the full amended text at the linked source."}, {"id": "INT-06", "topic": "Integrity — Discretionary waiver rule (regulation)", "tier": "state_reg", "actor": "caseworker", "nature": "policy", "citation": "N.J.A.C. 12:17-14.2(a)–(b)", "citationUrl": "https://www.law.cornell.edu/regulations/new-jersey/N-J-A-C-12-17-14-2", "statement": "The regulation makes the waiver discretionary (\"may\"), lists only three circumstances, and bars waiver where the claimant willfully or even negligently misrepresented or withheld a material fact.", "quote": "Upon request of the claimant or the claimant's representative, the Director may grant the claimant a full waiver of recovery of an overpayment of benefits only after the Director has determined that the claimant has not misrepresented or withheld any material fact in obtaining benefits and only under the following circumstances: 1. Where the claimant is deceased; 2. Where the claimant is disabled and no longer able to work; or 3. Where the recovery of the overpayment, as determined by the Director with the Controller's concurrence, would be patently contrary to the principles of equity.", "authority": {"higher": "N.J.S.A. 43:21-16(d)(4)", "higherUrl": "https://codes.findlaw.com/nj/title-43-pensions-and-retirement-and-unemployment-compensation/nj-st-sect-43-21-16/", "lower": "N.J.A.C. 12:17-14.2", "lowerUrl": "https://www.law.cornell.edu/regulations/new-jersey/N-J-A-C-12-17-14-2", "higherRef": null, "lowerRef": null, "controls": "state statute", "note": "The amended statute mandates the waiver (\"shall\") and adds a fourth circumstance (Division/employer error); the older regulation is narrower and discretionary — the statute controls."}, "forms": null, "gap": "12:17-14.2(b) makes even negligent misstatement a waiver bar with no honest-mistake safe harbor — check this against the amended statute with an SME."}, {"id": "INT-07", "topic": "Integrity — Two determinations bar recoupment", "tier": "state_reg", "actor": "system", "nature": "policy", "citation": "N.J.A.C. 12:17-14.4", "citationUrl": "https://www.law.cornell.edu/regulations/new-jersey/N-J-A-C-12-17-14-4", "statement": "Weeks paid after two determinations of entitlement are not recoupable (through the week before an appeal hearing) even if the decision is later reversed.", "quote": "If there are two determinations of entitlement, benefits for such period of entitlement shall be paid regardless of the outcome of any appeal which may be taken. ... no claimant shall be required to repay such benefits ... through the completed calendar week prior to the date of the appeal hearing, if the decision is finally reversed.", "authority": null, "forms": null, "gap": null}, {"id": "CONF-01", "topic": "Federal safeguards — Confidentiality of UC information", "tier": "federal_reg", "actor": "system", "nature": "policy", "citation": "20 CFR 603.4(b)", "citationUrl": "https://www.ecfr.gov/current/title-20/chapter-V/part-603/section-603.4", "statement": "Certification answers are confidential UC information: the state must maintain the confidentiality of identifying claimant and employer information and bar disclosure except as Part 603 allows.", "quote": "...'methods of administration' that are reasonably calculated to insure the full payment of UC when due must include provision for maintaining the confidentiality of any UC information which reveals the name or any identifying particular about any individual or any past or present employer or employing unit... and must include provision for barring the disclosure of any such information, except as provided in this part.", "authority": null, "forms": null, "gap": null}, {"id": "QC-01", "topic": "Federal safeguards — Cooperate with quality control review", "tier": "state_reg", "actor": "claimant", "nature": "policy", "citation": "N.J.A.C. 12:17-4.8(a)–(b)", "citationUrl": "https://www.law.cornell.edu/regulations/new-jersey/N-J-A-C-12-17-4-8", "statement": "A claimant selected for a quality-control review must report and cooperate; refusal without good cause makes them ineligible from that week until they agree to cooperate.", "quote": "A claimant shall be determined ineligible for unemployment benefits if he or she, without \"good cause,\" as defined in N.J.A.C. 12:17-4.1, fails to report as directed for a quality control review interview, or fails to cooperate in a quality control review of the claim.", "authority": null, "forms": null, "gap": null}, {"id": "QC-02", "topic": "Federal safeguards — Benefit Accuracy Measurement audits", "tier": "federal_reg", "actor": "system", "nature": "policy", "citation": "20 CFR 602.21(b)–(c)", "citationUrl": "https://www.ecfr.gov/current/title-20/chapter-V/part-602/section-602.21", "statement": "The state must run Benefit Accuracy Measurement: sample at least 400 paid-week cases per year and investigate payment accuracy in depth — the reason individual weekly certifications get audited.", "quote": "Each State shall: ... (b) Select representative samples for QC study of at least a minimum size specified by the Department to ensure statistical validity (for benefit payments, a minimum of 400 cases of weeks paid per State per year); (c) Complete prompt and in-depth case investigations to determine the degree of accuracy and timeliness in the administration of the State UC law...", "authority": null, "forms": null, "gap": null}, {"id": "WD-01", "topic": "Federal safeguards — Pay when due or lose certification", "tier": "federal_reg", "actor": "system", "nature": "policy", "citation": "20 CFR 601.5(a)", "citationUrl": "https://www.ecfr.gov/current/title-20/chapter-V/part-601/section-601.5", "statement": "Federal grants and certification are withheld if state law drops required SSA §303(a) provisions or the state denies benefits due in a substantial number of cases — certification logic must both pay when due and apply the required conditions.", "quote": "Payment of funds to States or yearend certification of State laws, or both, are withheld when the Secretary finds, after reasonable notice and opportunity for hearing: (1) That any provision required by section 303(a) of the Social Security Act is no longer included in the State unemployment compensation law; or ... (5) That in the administration of the State unemployment compensation law there has been a denial, in a substantial number of cases, of benefits due under such law...", "authority": null, "forms": null, "gap": null}], "blueprint": {"intro": "", "claimLane": "Claimant is asked / attests", "outcomeLane": "Outcome", "actors": [{"key": "claimant", "label": "Claimant action"}, {"key": "system", "label": "System (automated)"}, {"key": "caseworker", "label": "Caseworker (manual)"}], "columns": [{"id": "S1", "title": "File the certification for the designated benefit period", "q": "Did you certify for your benefit weeks on time, as directed?", "inputs": ["Assigned reporting method", "Designated benefit period (2 weeks, ends Saturday)", "Date certification completed", "Good cause for late filing"], "reqs": ["CERT-01", "CERT-03", "CERT-05", "CERT-02", "CERT-04", "CERT-07", "CERT-06"], "out": [{"t": "Certified on time → weeks processed", "kind": "good"}, {"t": "Late beyond 21 days, no good cause → ineligible for period", "kind": "bad"}, {"t": "Good cause claimed → fact-finding", "kind": "nd"}]}, {"id": "S2", "title": "Able to work & available for work", "q": "Were you able to work and available for work each day claimed?", "inputs": ["Physical ability to work", "Availability limitations", "Labor market for services offered", "Illness or jury duty during the week"], "reqs": ["AA-03", "AA-01", "AA-02", "AA-04", "AA-05", "AA-06"], "out": [{"t": "Able & available → continue", "kind": "good"}, {"t": "Availability issue → adjudication", "kind": "nd"}]}, {"id": "S3", "title": "Actively seeking work & registration", "q": "Did you actively look for work this week (or qualify for an exception)?", "inputs": ["Work search activity", "One-Stop appointment attendance", "Division-approved training enrollment"], "reqs": ["WS-02", "WS-03", "WS-01", "WS-05", "WS-06", "WS-04"], "out": [{"t": "Work search met or exception applies → continue", "kind": "good"}, {"t": "Missed One-Stop appointment, no good cause → week denied", "kind": "bad"}, {"t": "Work-search issue → fact-finding", "kind": "nd"}]}, {"id": "S4", "title": "Job offers & referrals during the week", "q": "Were you offered work or referred to a job — and did you accept?", "inputs": ["Bona fide offer or referral", "Offer details (duties, pay, hours)", "Claimant response"], "reqs": ["RSW-01", "RSW-02", "RSW-06", "RSW-07"], "out": [{"t": "No bona fide offer refused → continue", "kind": "good"}, {"t": "Refusal reported → suitability review", "kind": "nd"}]}, {"id": "S5", "title": "Suitability of refused work & good cause", "q": "Was the refused work suitable — and did you have good cause to refuse it?", "inputs": ["Suitability factors", "80% wage floor", "Labor-standards conditions", "Good cause for refusal"], "reqs": ["RSW-03", "RSW-08", "RSW-04", "RSW-05"], "out": [{"t": "Work unsuitable or good cause → no disqualification", "kind": "good"}, {"t": "Refused suitable work → disqualified week + 3 weeks", "kind": "bad"}]}, {"id": "S6", "title": "Work & earnings during the week", "q": "Did you work or earn any wages during the week claimed?", "inputs": ["Hours worked vs normal hours", "Gross earnings (incl. tips, in-kind)", "Full-time vs part-time status", "Cause of reduced hours"], "reqs": ["EARN-01", "EARN-04", "EARN-02", "EARN-03"], "out": [{"t": "No work, no earnings → total unemployment", "kind": "good"}, {"t": "Part-total work reported → compute partial benefit", "kind": "proc"}, {"t": "Full-time work → not unemployed, week denied", "kind": "bad"}]}, {"id": "S7", "title": "Partial benefit calculation", "q": "How much of your weekly benefit is payable after earnings?", "inputs": ["Weekly benefit rate", "Earnings disregard (greater of 20% of WBR or $5)", "Election-day board work"], "reqs": ["EARN-05", "EARN-06", "EARN-08", "EARN-07"], "out": [{"t": "Earnings within disregard → full benefit", "kind": "good"}, {"t": "Partial benefit paid (rounded down)", "kind": "partial"}, {"t": "Earnings too high → no payment for week", "kind": "bad"}]}, {"id": "S8", "title": "Other employer payments received", "q": "Did you receive any other pay from an employer for this week?", "inputs": ["Pay in lieu of notice", "Severance or separation pay", "Salary continuation", "Vacation / holiday pay", "Sick leave pay"], "reqs": ["PAY-01", "PAY-02", "PAY-03", "PAY-04", "PAY-05"], "out": [{"t": "Payment type not disqualifying → continue", "kind": "good"}, {"t": "In-lieu / salary continuation / paid shutdown / sick pay week → ineligible", "kind": "bad"}, {"t": "Payment needs classification → adjudication", "kind": "nd"}]}, {"id": "S9", "title": "Pension & retirement income", "q": "Are you receiving (or newly awarded) a pension or retirement payment?", "inputs": ["Pension / annuity / retired pay", "Base-period or chargeable employer plan", "Who contributed to the plan", "Constructive receipt date", "Rollover within 60 days"], "reqs": ["PEN-01", "PEN-02", "PEN-03", "PEN-04", "PEN-05", "PEN-06"], "out": [{"t": "No offsetable pension → full benefit", "kind": "good"}, {"t": "Offset applied → reduced, not below zero", "kind": "partial"}, {"t": "Retroactive award → overpayment established", "kind": "bad"}]}, {"id": "S10", "title": "Changes in circumstances since filing", "q": "Has anything changed — school, self-employment, leave, disability, temp work?", "inputs": ["Corporate office / ownership", "Leave of absence", "Self-employment activity", "Part-time-only availability", "School attendance", "Temp-firm reassignment contact", "Recovery from disability"], "reqs": ["CHG-06", "CHG-07", "CHG-09", "CHG-08", "CHG-01", "CHG-02", "CHG-03", "CHG-04", "CHG-05"], "out": [{"t": "No status change → continue", "kind": "good"}, {"t": "Status issue raised → adjudication", "kind": "nd"}, {"t": "Invalid claim status (officer / leave / student) → weeks denied", "kind": "bad"}]}, {"id": "S11", "title": "Truthful certification, overpayment & recovery", "q": "Were your answers true, complete, and accurate?", "inputs": ["Accuracy of certification answers", "Material facts disclosed", "Cause of any overpayment", "Waiver circumstances"], "reqs": ["INT-01", "INT-02", "INT-05", "INT-06", "INT-03", "INT-04", "INT-07"], "out": [{"t": "Accurate certification → payment stands", "kind": "good"}, {"t": "Overpayment → repay, offset, or waiver review", "kind": "nd"}, {"t": "Fraud → 25% fine + 1-year disqualification + prosecution", "kind": "bad"}]}], "crosscut": {"label": "Applies across every certified week", "reqs": ["CONF-01", "QC-01", "QC-02", "WD-01"]}}}</script>

<script>
// ============================================================================
//  Policy Service Blueprint — generic engine. All domain content lives in the
//  #data JSON block above; this script renders it and never hardcodes a domain.
//  The blueprint is the single source of truth (there is no flowchart): each
//  column carries its own header, questions, input factors, requirement ids,
//  and outcomes. Requirements are distributed into actor swimlanes.
// ============================================================================
const DATA = JSON.parse(document.getElementById('data').textContent);
const META = DATA.meta||{};
const RAW = DATA.requirements||[];
const REQ = {}; RAW.forEach(r=>REQ[r.id]=r);
const TIERS = DATA.tiers||[];
const TIER = {}; TIERS.forEach(t=>TIER[t.key]=t);
const BP = DATA.blueprint||{columns:[]};
const COLS = BP.columns||[];
// actor swimlanes — configurable per domain; fall back to a single policy lane
const ACTORS = (Array.isArray(BP.actors)&&BP.actors.length)?BP.actors:[{key:'policy',label:(BP.policyLane||'Policy requires')}];
const ACTOR = {}; ACTORS.forEach(a=>ACTOR[a.key]=a);
const LAST_ACTOR = ACTORS[ACTORS.length-1].key;
const OUTCOME_KINDS = Object.assign(
  {good:'#216e1f',bad:'#b50909',partial:'#c05600',nd:'#775540',na:'#565c65',proc:'#3d4551'},
  DATA.outcomeKinds||{});
const AUTH_LABEL = (META.authorityLabel||'Multiple policies');

// ---- dynamic theming from tiers + outcome kinds ----
function safe(k){return String(k).replace(/[^a-zA-Z0-9_]/g,'_');}
(function injectTheme(){
  let css='';
  TIERS.forEach(t=>{const k=safe(t.key);
    css+=`.t-${k}{border-left-color:${t.color}} .b-${k}{background:${t.color}} .c-${k}{background:${t.color}}\n`;});
  Object.entries(OUTCOME_KINDS).forEach(([k,c])=>{css+=`.o-${safe(k)}{background:${c}1f;color:${c};border-color:${c}66}\n`;});
  const s=document.createElement('style'); s.textContent=css; document.head.appendChild(s);
})();

// ---- helpers ----
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
// --- inline USWDS SVG icons (self-contained; fill=currentColor) ---
const ICONS={
  warning:'M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z',
  launch:'M19 19H5V5h7V3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z',
  build:'M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6 6 9 1.6 4.7C.4 7.1.9 10.1 2.9 12.1c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.5-.4.5-1.1.1-1.4z',
  balance:'M4 10v7h3v-7H4zm6 0v7h3v-7h-3zM2 22h19v-3H2v3zm14-12v7h3v-7h-3zm-4.5-9L2 6v2h19V6l-9.5-5z',
  description:'M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z',
  layers:'M11.99 18.54l-7.37-5.73L3 14.07l9 7 9-7-1.63-1.27-7.38 5.74zM12 16l7.36-5.73L21 9l-9-7-9 7 1.63 1.27L12 16z',
  expand_less:'M12 8l-6 6 1.41 1.41L12 10.83l4.59 4.58L18 14z',
  expand_more:'M16.59 8.59L12 13.17 7.41 8.59 6 10l6 6 6-6z'
};
function ic(name,cls){return '<svg class="ic'+(cls?' '+cls:'')+'" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="'+ICONS[name]+'"></path></svg>';}
function isOp(r){ return r && r.nature==='operational'; }
function laneOf(r){ return (r&&ACTOR[r.actor])?r.actor:LAST_ACTOR; } // requirements w/o a known actor fall to the last lane

// ---- requirement card ----
// render a citation in an authority callout. Link ONLY when the dataset gives an
// explicit ref to another requirement that actually exists and isn't the current one.
function authCite(cite, url, ref, currentId){
  if(url) return `<a class="authlink" href="${esc(url)}" target="_blank" rel="noopener">${esc(cite)}${ic('launch','ext')}</a>`;
  const id = (ref && ref!==currentId && REQ[ref]) ? ref : null;
  return id ? `<a class="authlink" data-open="${esc(id)}">${esc(cite)}</a>` : `<b>${esc(cite)}</b>`;
}
// One clean requirement block for the side panel — no card chrome.
function reqDetail(id){
  const r=REQ[id]; if(!r)return '';
  const a=r.authority;
  return `<div class="rdetail" data-id="${id}">
    <p class="stmt">${esc(r.statement)}</p>
    <div class="rdsub">${r.citationUrl?`<a class="authlink" href="${esc(r.citationUrl)}" target="_blank" rel="noopener">${esc(r.citation)}${ic('launch','ext')}</a>`:esc(r.citation)}</div>
    ${r.forms&&r.forms.length?`<div class="rdmeta">${ic('description','rdi')} ${r.forms.map(esc).join(' · ')}</div>`:''}
    <blockquote>${esc(r.quote)}</blockquote>
    ${a?`<div class="rdsub">${ic('balance','rdi')} ${esc(AUTH_LABEL)}</div>
    <div class="rdline">Higher: ${authCite(a.higher,a.higherUrl,a.higherRef,id)} · Lower: ${authCite(a.lower,a.lowerUrl,a.lowerRef,id)} · Controls: <b>${esc(a.controls)}</b></div>
    <div class="rdnote">${esc(a.note)}</div>`:''}
    ${r.gap?`<div class="rdsub">${ic('warning','rdi')} Potential issue (AI-suggested)</div>
    <div class="rdnote">${esc(r.gap)}</div>`:''}
  </div>`;
}

// ---- drawer ----
function openReq(id){
  const r=REQ[id]; if(!r)return;
  const tcolor=(TIER[r.tier]||{}).color||'#565c65';
  document.getElementById('dTitle').textContent=r.topic;
  const dt=document.getElementById('dType');
  dt.innerHTML=`<span class="typepill" style="background:${tcolor}">${esc(typeLabel(r.tier))}</span>`
    + (isOp(r)?`<span class="badge b-op">${ic('build')} operational</span>`:'');
  dt.style.display='';
  document.getElementById('dBody').innerHTML=reqDetail(id);
  document.getElementById('drawer').classList.add('open');
  document.getElementById('scrim').classList.add('open');
}
function closeDrawer(){document.getElementById('drawer').classList.remove('open');document.getElementById('scrim').classList.remove('open');}
document.getElementById('dClose').onclick=closeDrawer;
document.getElementById('scrim').onclick=closeDrawer;

// ---- blueprint ----
function chip(id){
  const r=REQ[id]; if(!r)return '';
  let mk=''; if(r.authority)mk+=ic('balance','mk'); if(isOp(r))mk+=ic('build','mk');
  return `<button class="chip c-${safe(r.tier)} ${isOp(r)?'op':''}" data-id="${id}" title="${esc(r.citation)}"><span class="chip-t">${esc(nameOf(r))}</span>${mk?`<span class="chip-mk">${mk}</span>`:''}</button>`;
}
function outPill(o){
  return `<span class="opill o-${safe(o.kind||'proc')}">${esc(o.t)}</span>`;
}
// group columns into contiguous runs sharing a `group` label. Each run renders as
// its own stacked table, so alternative paths read as separate journeys.
function columnGroups(){
  const groups=[]; let cur=null;
  COLS.forEach(c=>{
    const g=c.group||null;
    if(cur && cur.key===g){ cur.cols.push(c); }
    else { cur={key:g,label:g,cols:[c]}; groups.push(cur); }
  });
  return groups;
}
const GROUP_PALETTE=['#1a4480','#c05600','#216e1f','#54278f','#07648d'];
// render one blueprint grid for a set of columns
function gridFor(cols){
  const n=cols.length;
  let g=`<div class="bpgrid" style="grid-template-columns:140px repeat(${n},minmax(250px,1fr));min-width:${140+n*250}px">`;
  // headers
  g+='<div style="background:transparent"></div>';
  cols.forEach((c,i)=>{g+=`<div class="colhead"><span class="step">Step ${i+1}</span>${esc((c.title||'').replace(/\s*\?\s*$/,''))}</div>`;});
  // claimant lane: the question asked
  g+=`<div class="lanelbl lane-claim">${esc(BP.claimLane||'Claimant sees / is asked')}</div>`;
  cols.forEach(c=>{g+=`<div class="cell q">${esc(c.q||'')}</div>`;});
  // inputs lane: the factors that drive each step
  g+=`<div class="lanelbl lane-input">${esc(BP.inputLane||'Inputs')}</div>`;
  cols.forEach(c=>{
    const inputs=(c.inputs||[]).map(x=>`<span class="qi">${esc(x)}</span>`).join('');
    g+=`<div class="cell inputs ${inputs?'':'empty'}">${inputs}</div>`;
  });
  // one lane per actor
  ACTORS.forEach(a=>{
    g+=`<div class="lanelbl lane-actor">${esc(a.label)}</div>`;
    cols.forEach(c=>{
      const ids=(c.reqs||[]).filter(id=>REQ[id]&&laneOf(REQ[id])===a.key);
      g+=`<div class="cell actor ${ids.length?'':'empty'}">${ids.map(chip).join('')}</div>`;
    });
  });
  // outcome lane
  g+=`<div class="lanelbl lane-out">${esc(BP.outcomeLane||'Outcome')}</div>`;
  cols.forEach(c=>{g+=`<div class="cell out">${(c.out||[]).map(outPill).join('')}</div>`;});
  g+='</div>';
  return g;
}
function buildBlueprint(){
  const bp=document.getElementById('bp');
  const groups=columnGroups();
  const showTitles = groups.length>1 || groups.some(g=>g.key);
  let h='';
  groups.forEach((grp,gi)=>{
    const color=grp.key?GROUP_PALETTE[gi%GROUP_PALETTE.length]:'#3d4551';
    h+=`<div class="bptable">`;
    if(showTitles && grp.label){
      h+=`<div class="bptitle">${esc(grp.label)}</div>`;
    }
    h+=gridFor(grp.cols);
    h+=`</div>`;
  });
  bp.innerHTML=h;
  // crosscut
  const cc=document.getElementById('crosscut');
  if(BP.crosscut&&BP.crosscut.reqs&&BP.crosscut.reqs.length){
    cc.style.display='';
    cc.innerHTML=`<b>${esc(BP.crosscut.label||'Applies across every step')}</b><div class="cc-chips">${BP.crosscut.reqs.map(chip).join('')}</div>`;
  } else cc.style.display='none';
}
document.getElementById('bp').addEventListener('click',e=>{
  const b=e.target.closest('.chip'); if(b){openReq(b.dataset.id);return;}
});
document.getElementById('crosscut').addEventListener('click',e=>{const b=e.target.closest('.chip');if(b)openReq(b.dataset.id);});

// ---- all-requirements table ----
function typeLabel(k){ return ((TIER[k]||{}).label||k).replace(/\s*\([^)]*\)\s*$/,''); } // tier label without the parenthetical
function nameOf(r){ const i=r.topic.indexOf(' — '); return i>=0 ? r.topic.slice(i+3) : r.topic; } // drop a leading "Program — " prefix
function reqFlags(r){
  let s='';
  if(isOp(r)) s+=`<span class="flag" style="color:var(--flag-op)" title="Operational (agency practice, not strict policy)">${ic('build')}</span>`;
  if(r.gap) s+=`<span class="flag" style="color:var(--flag-warn)" title="Potential issue (AI-suggested)">${ic('warning')}</span>`;
  if(r.authority) s+=`<span class="flag" style="color:var(--flag-auth)" title="${esc(AUTH_LABEL)}">${ic('balance')}</span>`;
  return s||'<span style="color:var(--subtle)">—</span>';
}
// sort by type: federal tiers first, then state, then other; within a jurisdiction by authority rank
let typeSortDir = 1; // 1 = federal-first (default), -1 = reversed
function jurRank(k){
  const key=(k||'').toLowerCase(), lbl=((TIER[k]||{}).label||'').toLowerCase();
  if(key.includes('federal')||lbl.includes('federal')) return 0;
  if(key.includes('state')||lbl.includes('state')) return 1;
  return 2;
}
function typeKey(r){ return [jurRank(r.tier), (TIER[r.tier]||{}).rank||99]; }
function typeCmp(a,b){ const ka=typeKey(a), kb=typeKey(b); return (ka[0]-kb[0])||(ka[1]-kb[1]); }
function buildTable(){
  const op=document.getElementById('fOp').checked,
        gap=document.getElementById('fGap').checked,
        auth=document.getElementById('fAuth').checked;
  const rows=RAW.filter(r=>(!op||isOp(r)) && (!gap||r.gap) && (!auth||r.authority));
  rows.sort((a,b)=> typeSortDir*typeCmp(a,b) || nameOf(a).localeCompare(nameOf(b)));
  document.getElementById('rtbody').innerHTML = rows.length ? rows.map(r=>{
    const color=(TIER[r.tier]||{}).color||'#565c65';
    const cite = r.citationUrl
      ? `<a class="authlink" href="${esc(r.citationUrl)}" target="_blank" rel="noopener">${esc(r.citation)}${ic('launch','ext')}</a>`
      : esc(r.citation);
    return `<tr data-id="${esc(r.id)}">
      <td class="tname">${esc(nameOf(r))}</td>
      <td>${cite}</td>
      <td><span class="typepill" style="background:${color}">${esc(typeLabel(r.tier))}</span></td>
      <td class="tflags">${reqFlags(r)}</td>
    </tr>`;
  }).join('') : '<tr><td colspan="4" class="empty">No requirements match these filters.</td></tr>';
}
document.getElementById('rtbody').addEventListener('click',e=>{
  if(e.target.closest('a')) return; // let citation links open normally
  const tr=e.target.closest('tr'); if(tr&&tr.dataset.id) openReq(tr.dataset.id);
});
['fOp','fGap','fAuth'].forEach(id=>document.getElementById(id).addEventListener('change',buildTable));
document.getElementById('thType').addEventListener('click',()=>{
  typeSortDir*=-1;
  document.getElementById('typeSortInd').innerHTML = ic(typeSortDir===1?'expand_less':'expand_more');
  buildTable();
});

// ---- tab switching ----
document.querySelectorAll('.tab').forEach(tab=>tab.onclick=()=>{
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  tab.classList.add('active');
  const v=tab.dataset.view;
  document.getElementById('view-blueprint').style.display=v==='blueprint'?'':'none';
  document.getElementById('view-table').style.display=v==='table'?'':'none';
  if(v==='table')buildTable();
});

// ---- link handler (authority cross-links) ----
document.addEventListener('click',e=>{
  const link=e.target.closest('.authlink');
  if(link && link.dataset.open){ e.preventDefault(); openReq(link.dataset.open); return; }
});

// ---- view sources ----
const SOURCES = META.sources||[];
function openSources(){
  document.getElementById('dTitle').textContent='Sources';
  const dt=document.getElementById('dType'); dt.innerHTML=''; dt.style.display='none';
  const body = SOURCES.length
    ? `<ul style="list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:12px">`+
      SOURCES.map(s=>`<li style="background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px">`+
        (s.url
          ? `<a href="${esc(s.url)}" target="_blank" rel="noopener" style="color:#1d4ed8;font-weight:600;text-decoration:underline;word-break:break-word">${esc(s.label||s.url)}</a>`
          : `<span style="color:var(--ink);font-weight:600;word-break:break-word">${esc(s.label)}</span>`)+
        (s.note?`<div style="color:var(--muted);font-size:11.5px;margin-top:5px">${esc(s.note)}</div>`:'')+
      `</li>`).join('')+`</ul>`
    : '<p class="empty">No sources were recorded for this tool.</p>';
  document.getElementById('dBody').innerHTML=body;
  document.getElementById('drawer').classList.add('open');
  document.getElementById('scrim').classList.add('open');
}
document.getElementById('sourcesBtn').onclick=openSources;

// ---- init ----
(function init(){
  document.title = META.title||'Policy Service Blueprint';
  document.getElementById('hTitle').textContent = META.title||'Policy Service Blueprint';
  const hSub=document.getElementById('hSub');
  if(META.subtitle){ hSub.textContent=META.subtitle; } else { hSub.style.display='none'; }
  const introEl=document.getElementById('bpIntro');
  if(BP.intro){ introEl.textContent=BP.intro; } else { introEl.style.display='none'; }
  // legend: only tiers actually used, labeled exactly as the All-requirements table's Type column
  const usedTiers=new Set(RAW.map(r=>r.tier));
  let lg='';
  TIERS.filter(t=>usedTiers.has(t.key)).forEach(t=>{lg+=`<span class="typepill" style="background:${t.color}">${esc(typeLabel(t.key))}</span>`;});
  lg+=`<span class="lg"><span class="flag" style="color:var(--flag-op)">${ic('build')}</span> Operational (agency practice, not strict policy)</span>`;
  lg+=`<span class="lg"><span class="flag" style="color:var(--flag-warn)">${ic('warning')}</span> Potential issue (AI-suggested)</span>`;
  lg+=`<span class="lg"><span class="flag" style="color:var(--flag-auth)">${ic('balance')}</span> ${esc(AUTH_LABEL)}</span>`;
  document.getElementById('legend').innerHTML=lg;
  buildBlueprint();
})();
</script>
</body>
